name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Proje dosyalarını yaz
        run: |
          set -e
          cat > settings.gradle.kts <<'CHESSBOT_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "ChessBot"
          include(":app")
          CHESSBOT_EOF
          cat > build.gradle.kts <<'CHESSBOT_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          CHESSBOT_EOF
          cat > gradle.properties <<'CHESSBOT_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          android.useAndroidX=true
          kotlin.code.style=official
          CHESSBOT_EOF
          cat > .gitignore <<'CHESSBOT_EOF'
          build/
          .gradle/
          local.properties
          *.iml
          .idea/
          app/src/main/jniLibs/
          CHESSBOT_EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'CHESSBOT_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.wex1n.chessbot"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.wex1n.chessbot"
                  minSdk = 30
                  targetSdk = 34
                  versionCode = 3
                  versionName = "1.2"
                  ndk { abiFilters += "arm64-v8a" }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }

              // Stockfish'i libstockfish.so olarak çalıştırabilmek için dosyaya çıkarılmalı
              packaging { jniLibs { useLegacyPackaging = true } }
          }

          dependencies {
              implementation("com.github.bhlangonijr:chesslib:1.+")
              implementation("com.google.mlkit:text-recognition:16.0.1")
              implementation("com.google.android.gms:play-services-tasks:18.2.0")
          }
          CHESSBOT_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'CHESSBOT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />


              <application
                  android:allowBackup="false"
                  android:extractNativeLibs="true"
                  android:label="ChessBot"
                  android:theme="@android:style/Theme.DeviceDefault.Light">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

                  <service
                      android:name=".ChessBotService"
                      android:exported="true"
                      android:label="ChessBot"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          CHESSBOT_EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'CHESSBOT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:description="@string/service_desc"
              android:notificationTimeout="100" />
          CHESSBOT_EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'CHESSBOT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="service_desc">Ekranı okuyup satranç tahtasında hamle yapar (sadece kendi hesapların arasında kullan).</string>
          </resources>
          CHESSBOT_EOF
          mkdir -p app/src/main/java/com/wex1n/chessbot
          cat > app/src/main/java/com/wex1n/chessbot/BoardReader.kt <<'CHESSBOT_EOF'
          package com.wex1n.chessbot

          import android.graphics.Bitmap
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min

          /**
           * Ekran görüntüsünden tahtayı bulur ve okur.
           * - Tahta konumu otomatik bulunur (iki renkli dama deseni aranır).
           * - Taş şablonları oyunun BAŞLANGIÇ pozisyonundan öğrenilir (tema/taş seti fark etmez).
           * Kare indeksi (sq): rank*8 + file  (a1=0, h1=7, a8=56)
           */
          class BoardReader {
              @Volatile var x0 = 0f
              @Volatile var y0 = 0f
              @Volatile var x1 = 0f
              @Volatile var y1 = 0f
              @Volatile var whiteBottom = true
              @Volatile var trained = false

              private val n = 24            // her kareden 24x24 örnek
              private val c0 = 4            // merkez bölge: 4..19
              private val c1 = 20
              private val cells = (c1 - c0) * (c1 - c0)
              private val dim = cells * 2
              private val templates = Array(13) { FloatArray(dim) }

              val hasBoard: Boolean get() = (x1 - x0) > 50f && (y1 - y0) > 50f
              private val sw: Float get() = (x1 - x0) / 8f
              private val sh: Float get() = (y1 - y0) / 8f

              class SqFeat(val vec: FloatArray, val frac: Float, val meanLum: Float)

              companion object {
                  fun pieceIdx(ch: Char): Int = when (ch) {
                      'P' -> 0; 'N' -> 1; 'B' -> 2; 'R' -> 3; 'Q' -> 4; 'K' -> 5
                      'p' -> 6; 'n' -> 7; 'b' -> 8; 'r' -> 9; 'q' -> 10; 'k' -> 11
                      else -> 12
                  }

                  fun startChar(rank: Int, file: Int): Char = when (rank) {
                      0 -> "RNBQKBNR"[file]
                      1 -> 'P'
                      6 -> 'p'
                      7 -> "rnbqkbnr"[file]
                      else -> '.'
                  }
              }

              fun chessIdx(r: Int, c: Int): Int {
                  val file = if (whiteBottom) c else 7 - c
                  val rank = if (whiteBottom) 7 - r else r
                  return rank * 8 + file
              }

              /** Karenin ekrandaki merkez koordinatı */
              fun center(sq: Int): Pair<Float, Float> {
                  val file = sq % 8
                  val rank = sq / 8
                  val c = if (whiteBottom) file else 7 - file
                  val r = if (whiteBottom) 7 - rank else rank
                  return Pair(x0 + (c + 0.5f) * sw, y0 + (r + 0.5f) * sh)
              }

              // ------------------------------------------------------------------
              // Otomatik tahta bulma
              // ------------------------------------------------------------------

              private fun near(p: Int, c: IntArray, tol: Int): Boolean {
                  val r = (p shr 16) and 255
                  val g = (p shr 8) and 255
                  val b = p and 255
                  return abs(r - c[0]) + abs(g - c[1]) + abs(b - c[2]) <= tol
              }

              /** Ekran görüntüsünde 8x8 dama tahtasını arar. Bulursa x0,y0,x1,y1'i ayarlar. */
              fun autoDetect(bmp: Bitmap): Boolean {
                  val w = bmp.width
                  val h = bmp.height
                  val px = IntArray(w * h)
                  bmp.getPixels(px, 0, w, 0, 0, w, h)
                  val step = 6
                  val cw = w / step
                  val ch = h / step
                  if (cw < 60 || ch < 60) return false

                  // 1) En sık renkleri kümele
                  val hist = IntArray(4096)
                  val sr = LongArray(4096)
                  val sg = LongArray(4096)
                  val sb = LongArray(4096)
                  for (cy in 0 until ch) {
                      val row = (cy * step + step / 2) * w
                      for (cx in 0 until cw) {
                          val p = px[row + cx * step + step / 2]
                          val r = (p shr 16) and 255
                          val g = (p shr 8) and 255
                          val b = p and 255
                          val bin = ((r shr 4) shl 8) or ((g shr 4) shl 4) or (b shr 4)
                          hist[bin]++
                          sr[bin] += r.toLong()
                          sg[bin] += g.toLong()
                          sb[bin] += b.toLong()
                      }
                  }
                  val order = (0 until 4096).filter { hist[it] > 0 }.sortedByDescending { hist[it] }.take(40)
                  val reps = ArrayList<IntArray>()
                  val counts = ArrayList<Int>()
                  for (bn in order) {
                      val c = intArrayOf(
                          (sr[bn] / hist[bn]).toInt(),
                          (sg[bn] / hist[bn]).toInt(),
                          (sb[bn] / hist[bn]).toInt()
                      )
                      var found = -1
                      for (k in reps.indices) {
                          val q = reps[k]
                          if (abs(c[0] - q[0]) + abs(c[1] - q[1]) + abs(c[2] - q[2]) <= 24) { found = k; break }
                      }
                      if (found >= 0) {
                          counts[found] = counts[found] + hist[bn]
                      } else if (reps.size < 10) {
                          reps.add(c)
                          counts.add(hist[bn])
                      }
                  }
                  val kc = reps.size
                  if (kc < 2) return false

                  // 2) Her hücreye küme numarası ver
                  val ids = IntArray(cw * ch) { -1 }
                  for (cy in 0 until ch) {
                      val row = (cy * step + step / 2) * w
                      for (cx in 0 until cw) {
                          val p = px[row + cx * step + step / 2]
                          for (k in 0 until kc) {
                              if (near(p, reps[k], 24)) { ids[cy * cw + cx] = k; break }
                          }
                      }
                  }

                  // 3) Her renk çifti için: dama desenli kare bölge ara
                  var bestPs = 0f
                  var bestSide = 0f
                  var bestX = 0f
                  var bestY = 0f
                  val minS = 300 / step
                  val ii = IntArray((cw + 1) * (ch + 1))
                  for (i in 0 until kc) {
                      for (j in i + 1 until kc) {
                          val ci = counts[i]
                          val cj = counts[j]
                          if (ci < 600 || cj < 600) continue
                          val ratio = ci.toFloat() / cj
                          if (ratio < 0.35f || ratio > 2.8f) continue

                          java.util.Arrays.fill(ii, 0)
                          for (y in 1..ch) {
                              var rs = 0
                              for (x in 1..cw) {
                                  val id = ids[(y - 1) * cw + (x - 1)]
                                  if (id == i || id == j) rs++
                                  ii[y * (cw + 1) + x] = ii[(y - 1) * (cw + 1) + x] + rs
                              }
                          }

                          var s = min(cw, ch)
                          var found = false
                          var winX = 0
                          var winY = 0
                          var winS = 0
                          while (s >= minS && !found) {
                              var bestD = 0f
                              var bxx = 0
                              var byy = 0
                              var yy = 0
                              while (yy + s <= ch) {
                                  var xx = 0
                                  while (xx + s <= cw) {
                                      val sum = ii[(yy + s) * (cw + 1) + xx + s] - ii[yy * (cw + 1) + xx + s] -
                                          ii[(yy + s) * (cw + 1) + xx] + ii[yy * (cw + 1) + xx]
                                      val d = sum.toFloat() / (s * s)
                                      if (d > bestD) { bestD = d; bxx = xx; byy = yy }
                                      xx += 2
                                  }
                                  yy += 2
                              }
                              if (bestD >= 0.72f) {
                                  found = true; winX = bxx; winY = byy; winS = s
                              } else {
                                  s -= 2
                              }
                          }
                          if (!found) continue

                          val rc = refine(px, w, h, reps[i], reps[j], winX * step, winY * step, winS * step) ?: continue
                          val ps = parity(px, w, h, rc[0], rc[1], rc[2], reps[i], reps[j])
                          if (ps > bestPs || (ps == bestPs && rc[2] > bestSide)) {
                              bestPs = ps; bestSide = rc[2]; bestX = rc[0]; bestY = rc[1]
                          }
                      }
                  }
                  if (bestPs < 0.85f || bestSide <= 0f) return false
                  x0 = bestX
                  y0 = bestY
                  x1 = bestX + bestSide
                  y1 = bestY + bestSide
                  return true
              }

              /** Kaba pencereden tam kenarları (piksel) bulur: [x, y, kenar] */
              private fun refine(
                  px: IntArray, w: Int, h: Int, a: IntArray, b: IntArray,
                  wx: Int, wy: Int, ws: Int
              ): FloatArray? {
                  fun ab(x: Int, y: Int): Boolean {
                      val p = px[y * w + x]
                      return near(p, a, 30) || near(p, b, 30)
                  }
                  val m = (0.2f * ws).toInt()
                  val lo = max(0, wx - m)
                  val hi = min(w - 1, wx + ws + m)
                  val to = max(0, wy - m)
                  val bo = min(h - 1, wy + ws + m)
                  val yb0 = wy + (0.2f * ws).toInt()
                  val yb1 = min(h - 1, wy + (0.8f * ws).toInt())
                  val xb0 = wx + (0.2f * ws).toInt()
                  val xb1 = min(w - 1, wx + (0.8f * ws).toInt())

                  fun colD(x: Int): Float {
                      var cnt = 0
                      var tot = 0
                      var y = yb0
                      while (y <= yb1) { tot++; if (ab(x, y)) cnt++; y += 3 }
                      return if (tot == 0) 0f else cnt.toFloat() / tot
                  }

                  fun rowD(y: Int): Float {
                      var cnt = 0
                      var tot = 0
                      var x = xb0
                      while (x <= xb1) { tot++; if (ab(x, y)) cnt++; x += 3 }
                      return if (tot == 0) 0f else cnt.toFloat() / tot
                  }

                  val cx = min(w - 1, wx + ws / 2)
                  val cy = min(h - 1, wy + ws / 2)
                  if (colD(cx) < 0.3f || rowD(cy) < 0.3f) return null
                  var l = cx
                  while (l - 1 >= lo && colD(l - 1) >= 0.3f) l--
                  var r = cx
                  while (r + 1 <= hi && colD(r + 1) >= 0.3f) r++
                  var t = cy
                  while (t - 1 >= to && rowD(t - 1) >= 0.3f) t--
                  var bt = cy
                  while (bt + 1 <= bo && rowD(bt + 1) >= 0.3f) bt++

                  val width = (r + 1 - l).toFloat()
                  val height = (bt + 1 - t).toFloat()
                  if (width < 200f || height < 200f) return null
                  if (abs(width - height) > 0.06f * max(width, height)) return null
                  val side = (width + height) / 2f
                  return floatArrayOf(l.toFloat(), t.toFloat(), side)
              }

              /** Bölge gerçekten dama deseni mi? 0..1 arası uyum puanı döner. */
              private fun parity(
                  px: IntArray, w: Int, h: Int, bx: Float, by: Float, side: Float,
                  a: IntArray, b: IntArray
              ): Float {
                  val sq = side / 8f
                  var pass0 = 0
                  var pass1 = 0
                  for (r in 0 until 8) {
                      for (c in 0 until 8) {
                          var ca = 0
                          var cb = 0
                          for (j in 0 until 9) {
                              for (i in 0 until 9) {
                                  val x = (bx + (c + 0.1f + 0.8f * (i + 0.5f) / 9f) * sq).toInt().coerceIn(0, w - 1)
                                  val y = (by + (r + 0.1f + 0.8f * (j + 0.5f) / 9f) * sq).toInt().coerceIn(0, h - 1)
                                  val p = px[y * w + x]
                                  if (near(p, a, 30)) ca++ else if (near(p, b, 30)) cb++
                              }
                          }
                          val even = (r + c) % 2 == 0
                          val e0 = if (even) ca else cb
                          val o0 = if (even) cb else ca
                          if (e0 >= 8 && o0 * 3 < e0) pass0++
                          val e1 = if (even) cb else ca
                          val o1 = if (even) ca else cb
                          if (e1 >= 8 && o1 * 3 < e1) pass1++
                      }
                  }
                  return max(pass0, pass1) / 64f
              }

              // ------------------------------------------------------------------
              // Kare özellikleri ve taş tanıma
              // ------------------------------------------------------------------

              private fun feat(bmp: Bitmap, r: Int, c: Int): SqFeat {
                  val left = x0 + c * sw
                  val top = y0 + r * sh
                  val total = n * n
                  val rr = IntArray(total)
                  val gg = IntArray(total)
                  val bb = IntArray(total)
                  val maxX = bmp.width - 1
                  val maxY = bmp.height - 1
                  for (j in 0 until n) {
                      for (i in 0 until n) {
                          val fx = left + (0.05f + 0.9f * (i + 0.5f) / n) * sw
                          val fy = top + (0.05f + 0.9f * (j + 0.5f) / n) * sh
                          val p = bmp.getPixel(fx.toInt().coerceIn(0, maxX), fy.toInt().coerceIn(0, maxY))
                          val k = j * n + i
                          rr[k] = (p shr 16) and 255
                          gg[k] = (p shr 8) and 255
                          bb[k] = p and 255
                      }
                  }
                  // Zemin rengi = karedeki en sık renk
                  val hist = IntArray(4096)
                  val bins = IntArray(total)
                  for (k in 0 until total) {
                      val b = ((rr[k] shr 4) shl 8) or ((gg[k] shr 4) shl 4) or (bb[k] shr 4)
                      bins[k] = b
                      hist[b]++
                  }
                  var best = 0
                  for (b in 1 until 4096) if (hist[b] > hist[best]) best = b
                  var sr = 0; var sg = 0; var sb = 0; var cnt = 0
                  for (k in 0 until total) {
                      if (bins[k] == best) { sr += rr[k]; sg += gg[k]; sb += bb[k]; cnt++ }
                  }
                  val bgr = sr / cnt
                  val bgg = sg / cnt
                  val bgb = sb / cnt

                  val bgSim = BooleanArray(total)
                  for (k in 0 until total) {
                      bgSim[k] = abs(rr[k] - bgr) + abs(gg[k] - bgg) + abs(bb[k] - bgb) <= 40
                  }
                  // Kenardan zemini doldur (flood fill); ulaşılamayan = taş
                  val reach = BooleanArray(total)
                  val stack = IntArray(total)
                  var sp = 0
                  fun push(k: Int) {
                      if (bgSim[k] && !reach[k]) { reach[k] = true; stack[sp++] = k }
                  }
                  for (i in 0 until n) {
                      push(i); push((n - 1) * n + i); push(i * n); push(i * n + n - 1)
                  }
                  while (sp > 0) {
                      val k = stack[--sp]
                      val x = k % n
                      val y = k / n
                      if (x > 0) push(k - 1)
                      if (x < n - 1) push(k + 1)
                      if (y > 0) push(k - n)
                      if (y < n - 1) push(k + n)
                  }

                  val v = FloatArray(dim)
                  var mc = 0
                  var lumSum = 0f
                  var idx = 0
                  for (j in c0 until c1) {
                      for (i in c0 until c1) {
                          val k = j * n + i
                          if (!reach[k]) {
                              val lum = (rr[k] * 299 + gg[k] * 587 + bb[k] * 114) / 255000f
                              v[idx] = 1f
                              v[cells + idx] = lum
                              mc++
                              lumSum += lum
                          }
                          idx++
                      }
                  }
                  return SqFeat(v, mc.toFloat() / cells, if (mc > 0) lumSum / mc else 0f)
              }

              // ------------------------------------------------------------------
              // Kör mod: taş okumadan, sadece son hamle vurgusunu (sarı kareler) bulur
              // ------------------------------------------------------------------

              private fun colDist(a: IntArray, b: IntArray): Int =
                  abs(a[0] - b[0]) + abs(a[1] - b[1]) + abs(a[2] - b[2])

              /** Karenin zemin rengi (en sık renk). */
              private fun squareBg(bmp: Bitmap, r: Int, c: Int): IntArray {
                  val left = x0 + c * sw
                  val top = y0 + r * sh
                  val m = 12
                  val hist = IntArray(4096)
                  val sr = IntArray(4096)
                  val sg = IntArray(4096)
                  val sb = IntArray(4096)
                  val maxX = bmp.width - 1
                  val maxY = bmp.height - 1
                  for (j in 0 until m) {
                      for (i in 0 until m) {
                          val fx = left + (0.08f + 0.84f * (i + 0.5f) / m) * sw
                          val fy = top + (0.08f + 0.84f * (j + 0.5f) / m) * sh
                          val p = bmp.getPixel(fx.toInt().coerceIn(0, maxX), fy.toInt().coerceIn(0, maxY))
                          val rr = (p shr 16) and 255
                          val gg = (p shr 8) and 255
                          val bb = p and 255
                          val bin = ((rr shr 4) shl 8) or ((gg shr 4) shl 4) or (bb shr 4)
                          hist[bin]++
                          sr[bin] += rr
                          sg[bin] += gg
                          sb[bin] += bb
                      }
                  }
                  var best = 0
                  for (b in 1 until 4096) if (hist[b] > hist[best]) best = b
                  val n0 = max(1, hist[best])
                  return intArrayOf(sr[best] / n0, sg[best] / n0, sb[best] / n0)
              }

              // ------------------------------------------------------------------
              // Kör mod (hızlı yakalama): ızgara örneklerinden "kareye bir şey çizilmiş mi" ölçümü
              // ------------------------------------------------------------------

              private val pHist = IntArray(512)
              private val pSr = IntArray(512)
              private val pSg = IntArray(512)
              private val pSb = IntArray(512)

              /** Tam ekran görüntüsünden FrameHub ile aynı biçimde 96x96 örnek ızgarası çıkarır. */
              fun gridFromBitmap(bmp: Bitmap): IntArray {
                  val g = FrameHub.G
                  val grid = IntArray(g * g)
                  val side = x1 - x0
                  val maxX = bmp.width - 1
                  val maxY = bmp.height - 1
                  for (gy in 0 until g) {
                      val y = (y0 + (gy + 0.5f) * side / g).toInt().coerceIn(0, maxY)
                      for (gx in 0 until g) {
                          val x = (x0 + (gx + 0.5f) * side / g).toInt().coerceIn(0, maxX)
                          grid[gy * g + gx] = bmp.getPixel(x, y) and 0xFFFFFF
                      }
                  }
                  return grid
              }

              /**
               * Her karede, kendi zemin renginden (karedeki en sık renk) farklı örneklerin oranı.
               * Seçili kare vurgusu zemin rengini değiştirir ama oranı artırmaz; taş çizimi oranı artırır.
               * Dizin: satranç karesi (rank*8+file).
               */
              fun frac(grid: IntArray): FloatArray {
                  val out = FloatArray(64)
                  val m = 12
                  val g = FrameHub.G
                  val cols = IntArray(m * m)
                  for (r in 0 until 8) {
                      for (c in 0 until 8) {
                          var k = 0
                          for (j in 0 until m) for (i in 0 until m) {
                              cols[k++] = grid[(r * m + j) * g + (c * m + i)]
                          }
                          java.util.Arrays.fill(pHist, 0)
                          java.util.Arrays.fill(pSr, 0)
                          java.util.Arrays.fill(pSg, 0)
                          java.util.Arrays.fill(pSb, 0)
                          for (p in cols) {
                              val rr = (p shr 16) and 255
                              val gg = (p shr 8) and 255
                              val bb = p and 255
                              val bin = ((rr shr 5) shl 6) or ((gg shr 5) shl 3) or (bb shr 5)
                              pHist[bin]++
                              pSr[bin] += rr
                              pSg[bin] += gg
                              pSb[bin] += bb
                          }
                          var best = 0
                          for (b in 1 until 512) if (pHist[b] > pHist[best]) best = b
                          val n0 = max(1, pHist[best])
                          val br = pSr[best] / n0
                          val bg = pSg[best] / n0
                          val bb2 = pSb[best] / n0
                          var diff = 0
                          for (p in cols) {
                              val rr = (p shr 16) and 255
                              val gg = (p shr 8) and 255
                              val bb = p and 255
                              if (abs(rr - br) + abs(gg - bg) + abs(bb - bb2) > 40) diff++
                          }
                          out[chessIdx(r, c)] = diff.toFloat() / (m * m)
                      }
                  }
                  return out
              }

              /** Karenin sol üst köşesindeki koordinat yazısının (rakam) mürekkep miktarı. */
              private fun labelInk(bmp: Bitmap, r: Int, c: Int): Int {
                  val bg = squareBg(bmp, r, c)
                  val left = x0 + c * sw
                  val top = y0 + r * sh
                  val maxX = bmp.width - 1
                  val maxY = bmp.height - 1
                  val stepPx = max(1, (sw / 70f).toInt())
                  var ink = 0
                  var y = top + 0.02f * sh
                  val yEnd = top + 0.40f * sh
                  while (y < yEnd) {
                      var x = left + 0.02f * sw
                      val xEnd = left + 0.34f * sw
                      while (x < xEnd) {
                          val p = bmp.getPixel(x.toInt().coerceIn(0, maxX), y.toInt().coerceIn(0, maxY))
                          val px = intArrayOf((p shr 16) and 255, (p shr 8) and 255, p and 255)
                          if (colDist(px, bg) > 40) ink++
                          x += stepPx
                      }
                      y += stepPx
                  }
                  return ink
              }

              /**
               * Taşlar görünmese bile tahtadaki koordinat rakamlarından yönü bulur:
               * üst sol köşedeki "8" (çok mürekkep) ise beyaz altta, "1" (az mürekkep) ise siyah altta.
               * Emin değilse null döner.
               */
              fun orientationFromLabels(bmp: Bitmap): Boolean? {
                  if (!hasBoard) return null
                  val top = labelInk(bmp, 0, 0)
                  val bot = labelInk(bmp, 7, 0)
                  if (top + bot < 12) return null
                  return when {
                      top > bot * 1.25f -> true
                      bot > top * 1.25f -> false
                      else -> null
                  }
              }

              /** Vurgulu (rengi normal açık/koyu kareden farklı) karelerin satranç indeksleri. whiteBottom ayarlı olmalı. */
              fun highlighted(bmp: Bitmap): Set<Int> {
                  val bg = Array(64) { k -> squareBg(bmp, k / 8, k % 8) }
                  val out = HashSet<Int>()
                  for (par in 0..1) {
                      val idxs = (0 until 64).filter { ((it / 8) + (it % 8)) % 2 == par }
                      var bestK = idxs[0]
                      var bestN = -1
                      for (k in idxs) {
                          var cnt = 0
                          for (m in idxs) if (colDist(bg[k], bg[m]) <= 14) cnt++
                          if (cnt > bestN) { bestN = cnt; bestK = k }
                      }
                      for (k in idxs) {
                          if (colDist(bg[k], bg[bestK]) > 30) out.add(chessIdx(k / 8, k % 8))
                      }
                  }
                  return out
              }

              private fun allFeatures(bmp: Bitmap): Array<SqFeat> =
                  Array(64) { k -> feat(bmp, k / 8, k % 8) }

              /** Başlangıç pozisyonu görünüyor mu + hangi renk altta? (whiteBottom'u ayarlar) */
              private fun analyzeStart(f: Array<SqFeat>): String? {
                  var minOcc = 1f
                  var maxEmp = 0f
                  for (r in 0 until 8) for (c in 0 until 8) {
                      val fr = f[r * 8 + c].frac
                      if (r <= 1 || r >= 6) { if (fr < minOcc) minOcc = fr } else { if (fr > maxEmp) maxEmp = fr }
                  }
                  if (minOcc < 0.10f || maxEmp > 0.05f) {
                      return "Başlangıç pozisyonu görünmüyor. Yeni oyunun ilk anında ▶'e bas (düz renkli tahta teması gerekli)."
                  }
                  var top = 0f
                  var bot = 0f
                  for (c in 0 until 8) {
                      top += f[c].meanLum + f[8 + c].meanLum
                      bot += f[48 + c].meanLum + f[56 + c].meanLum
                  }
                  top /= 16f
                  bot /= 16f
                  if (abs(top - bot) < 0.08f) return "Beyaz/siyah taşlar ayırt edilemedi"
                  whiteBottom = bot > top
                  return null
              }

              /** Kör mod: sadece oyunun başında bir kez bakıp rengi anlar (şablon öğrenmez). */
              fun checkStart(bmp: Bitmap): String? {
                  if (!hasBoard) return "Tahta bulunamadı"
                  return analyzeStart(allFeatures(bmp))
              }

              /** Başlangıç pozisyonundan şablonları öğrenir. Hata varsa mesaj döner, başarıda null. */
              fun tryTrain(bmp: Bitmap): String? {
                  if (!hasBoard) return "Tahta bulunamadı"
                  val f = allFeatures(bmp)
                  analyzeStart(f)?.let { return it }

                  val sums = Array(13) { FloatArray(dim) }
                  val counts = IntArray(13)
                  for (r in 0 until 8) for (c in 0 until 8) {
                      val sq = chessIdx(r, c)
                      val t = pieceIdx(startChar(sq / 8, sq % 8))
                      val v = f[r * 8 + c].vec
                      val s = sums[t]
                      for (i in 0 until dim) s[i] += v[i]
                      counts[t]++
                  }
                  for (t in 0 until 13) {
                      if (counts[t] > 0) for (i in 0 until dim) templates[t][i] = sums[t][i] / counts[t]
                  }
                  trained = true
                  return null
              }

              /** Her kare için 13 şablona (6 beyaz, 6 siyah, boş) uzaklık. Dizi: [sq][piece] */
              fun distances(bmp: Bitmap): Array<DoubleArray> {
                  val f = allFeatures(bmp)
                  val out = Array(64) { DoubleArray(13) }
                  for (r in 0 until 8) for (c in 0 until 8) {
                      val sq = chessIdx(r, c)
                      val v = f[r * 8 + c].vec
                      for (t in 0 until 13) {
                          val tp = templates[t]
                          var s = 0.0
                          for (i in 0 until dim) {
                              val d = v[i] - tp[i]
                              s += d * d
                          }
                          out[sq][t] = s
                      }
                  }
                  return out
              }
          }
