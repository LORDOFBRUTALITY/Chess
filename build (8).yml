              private fun startGame() {
                  if (running) return
                  running = true
                  minimize()
                  Thread {
                      try {
                          runGame()
                      } catch (e: Exception) {
                          setStatus("Hata: ${e.message}")
                      } finally {
                          running = false
                          expand()
                      }
                  }.start()
              }

              private fun stopGame() {
                  running = false
                  if (::engine.isInitialized) engine.stop()
                  setStatus("Durduruldu")
              }

              private fun screenshot(): Bitmap? {
                  val latch = CountDownLatch(1)
                  var result: Bitmap? = null
                  takeScreenshot(
                      Display.DEFAULT_DISPLAY,
                      mainExecutor,
                      object : AccessibilityService.TakeScreenshotCallback {
                          override fun onSuccess(r: AccessibilityService.ScreenshotResult) {
                              try {
                                  val hb = r.hardwareBuffer
                                  val hw = Bitmap.wrapHardwareBuffer(hb, r.colorSpace)
                                  result = hw?.copy(Bitmap.Config.ARGB_8888, false)
                                  hb.close()
                              } catch (_: Exception) {
                              }
                              latch.countDown()
                          }

                          override fun onFailure(errorCode: Int) {
                              latch.countDown()
                          }
                      }
                  )
                  latch.await(3, TimeUnit.SECONDS)
                  return result
              }

              private fun tap(p: Pair<Float, Float>) {
                  val path = Path().apply { moveTo(p.first, p.second) }
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 60))
                      .build()
                  val latch = CountDownLatch(1)
                  dispatchGesture(g, object : AccessibilityService.GestureResultCallback() {
                      override fun onCompleted(gestureDescription: GestureDescription?) { latch.countDown() }
                      override fun onCancelled(gestureDescription: GestureDescription?) { latch.countDown() }
                  }, main)
                  latch.await(2, TimeUnit.SECONDS)
              }

              private fun sqIdx(name: String): Int = (name[1] - '1') * 8 + (name[0].uppercaseChar() - 'A')

              private fun uciOf(m: Move): String {
                  val promo = if (m.promotion != Piece.NONE) m.promotion.fenSymbol.lowercase() else ""
                  return m.from.name.lowercase() + m.to.name.lowercase() + promo
              }

              private fun findMove(board: Board, uci: String): Move? =
                  board.legalMoves().firstOrNull { uciOf(it) == uci }

              private fun playMove(m: Move) {
                  val from = sqIdx(m.from.name)
                  val to = sqIdx(m.to.name)
                  tap(reader.center(from))
                  Thread.sleep(350)
                  tap(reader.center(to))
                  if (m.promotion != Piece.NONE) {
                      // Terfi penceresi: vezir genelde hedef karede çıkar
                      Thread.sleep(700)
                      tap(reader.center(to))
                  }
              }

              private fun placement(fen: String): CharArray {
                  val out = CharArray(64) { '.' }
                  val ranks = fen.substringBefore(' ').split('/')
                  for ((i, rs) in ranks.withIndex()) {
                      val rank = 7 - i
                      var file = 0
                      for (ch in rs) {
                          if (ch.isDigit()) file += (ch - '0') else { out[rank * 8 + file] = ch; file++ }
                      }
                  }
                  return out
              }

              private fun placementAfter(board: Board, m: Move?): CharArray {
                  if (m == null) return placement(board.fen)
                  board.doMove(m)
                  val p = placement(board.fen)
                  board.undoMove()
                  return p
              }

              private fun score(d: Array<DoubleArray>, p: CharArray): Double {
                  var s = 0.0
                  for (sq in 0 until 64) s += d[sq][BoardReader.pieceIdx(p[sq])]
                  return s
              }

              // ------------------------------------------------------- Hamle seçimi (modlar)

              /** Değerlendirmeyi 0..1 kazanma beklentisine çevirir. */
              private fun winProb(l: Engine.Line): Double {
                  val m = l.mate
                  if (m != null) {
                      val k = min(abs(m), 60) * 0.0001
                      return if (m > 0) 1.0 - k else k
                  }
                  val cp = (l.cp ?: 0).toDouble()
                  return 1.0 / (1.0 + Math.pow(10.0, -cp / 400.0))
              }

              private class PvInfo(val delta: Int, val total: Int)

              private fun materialDiff(fen: String): Int {
                  var d = 0
                  for (ch in fen.substringBefore(' ')) {
                      d += when (ch) {
                          'P' -> 1; 'N' -> 3; 'B' -> 3; 'R' -> 5; 'Q' -> 9
                          'p' -> -1; 'n' -> -3; 'b' -> -3; 'r' -> -5; 'q' -> -9
                          else -> 0
                      }
                  }
                  return d
              }

              private fun materialTotal(fen: String): Int {
                  var t = 0
                  for (ch in fen.substringBefore(' ')) {
                      t += when (ch.lowercaseChar()) {
                          'p' -> 1; 'n' -> 3; 'b' -> 3; 'r' -> 5; 'q' -> 9
                          else -> 0
                      }
                  }
                  return t
              }

              /** Hamle dizisinin (PV) ilk [plies] hamlesi sonunda bizim malzeme farkımız ve tahtadaki toplam malzeme. */
              private fun pvInfo(board: Board, pv: List<String>, plies: Int, mySide: Side): PvInfo? {
                  val base = materialDiff(board.fen)
                  var done = 0
                  for (u in pv.take(plies)) {
                      val m = findMove(board, u) ?: break
                      board.doMove(m)
                      done++
                  }
                  val fen = board.fen
                  for (i in 0 until done) board.undoMove()
                  if (done < 2) return null
                  val sign = if (mySide == Side.WHITE) 1 else -1
                  return PvInfo((materialDiff(fen) - base) * sign, materialTotal(fen))
              }

              /**
               * Parlak ‼ / Harika ! hamle avı:
               *  1) Tek iyi hamle durumu (2. en iyi hamle çok daha kötü) -> en iyi hamleyi oyna ("!" harika adayı)
               *  2) Sağlam fedakarlık (malzeme verip değerlendirmeyi koruyan hamle) -> oyna ("‼" parlak adayı)
               *  3) Hiçbiri yoksa, en iyiye denk hamleler arasından taşları tahtada tutan (gerilimi koruyan) hamle
               * Hedef hamleye gelince normal (en iyi hamle) oynayıp oyunu bitirir.
               * Dönüş: (hamle, etiket) etiket: "‼", "!" veya "".
               */
              private fun pickFarm(board: Board, lines: List<Engine.Line>, ourMoves: Int, target: Int, mySide: Side): Pair<Move, String>? {
                  val top = lines[0]
                  val topMove = findMove(board, top.move) ?: return null
                  val wTop = winProb(top)
                  if (ourMoves >= target || wTop < 0.5) return Pair(topMove, "")

                  // 1) Harika (!)
                  if (lines.size >= 2) {
                      val w2 = winProb(lines[1])
                      val isCapture = board.getPiece(topMove.to) != Piece.NONE
                      if (wTop - w2 >= 0.15 && wTop >= 0.4 && !isCapture) return Pair(topMove, "!")
                  }

                  // 2) Parlak (‼): sağlam fedakarlık, zaten ezici üstünlükte değilken
                  if (wTop <= 0.92) {
                      var bestSac: Move? = null
                      var bestW = -1.0
                      for (l in lines) {
                          val w = winProb(l)
                          if (wTop - w > 0.02 || w < 0.5) continue
                          val m = findMove(board, l.move) ?: continue
                          val info = pvInfo(board, l.pv, 4, mySide) ?: continue
                          if (info.delta > -2) continue
                          board.doMove(m)
                          val bad = board.isMated || board.isDraw
                          board.undoMove()
                          if (bad) continue
                          if (w > bestW) { bestW = w; bestSac = m }
                      }
                      if (bestSac != null) return Pair(bestSac, "‼")
                  }

                  // 3) Gerilimi koru: en iyiye denk hamleler arasından tahtada en çok malzeme bırakan
                  var bestMove: Move? = null
                  var bestKey = Double.MAX_VALUE
                  for (l in lines) {
                      val w = winProb(l)
                      if (wTop - w > 0.015) continue
                      val m = findMove(board, l.move) ?: continue
                      board.doMove(m)
                      val bad = board.isMated || board.isDraw
                      val fenAfter = board.fen
                      board.undoMove()
                      if (bad) continue
                      val info = pvInfo(board, l.pv, 4, mySide)
                      val total = (info?.total ?: materialTotal(fenAfter)).toDouble()
                      val mt = l.mate
                      val urgency = if (mt != null && mt > 0) 1000.0 / mt else 0.0
                      val key = urgency * 100.0 - total * 10.0 - w * 5.0
                      if (key < bestKey) { bestKey = key; bestMove = m }
                  }
                  return Pair(bestMove ?: topMove, "")
              }

              private fun runGame() {
                  setStatus("Motor başlatılıyor…")
                  engine.start()?.let { setStatus(it); return }
                  val p = prefs()
                  val mode = p.getInt("mode", 0)
                  val moveTime = p.getInt("movetime", 1500)
                  val target = p.getInt("target", 50)

                  Thread.sleep(500)
                  val first = screenshot()
                  if (first == null) { setStatus("Ekran görüntüsü alınamadı"); return }
                  if (reader.autoDetect(first)) {
                      persistRect()
                  } else if (!reader.hasBoard) {
                      setStatus("Tahta bulunamadı. Tahta ekranda açık ve tema düz renkli olmalı.")
                      return
                  }
                  if (mode == 2) { runBlind(first, moveTime); return }
                  reader.tryTrain(first)?.let { setStatus(it); return }

                  val board = Board()
                  val botSide = if (reader.whiteBottom) Side.WHITE else Side.BLACK
                  engine.newGame()

                  var sent: Move? = null
                  var sentAt = 0L
                  var retries = 0
                  var lastBest = -2
                  var lastCount = 0
                  var ourMoves = 0
                  var brill = 0
                  var great = 0
                  var endMsg: String? = null

                  while (running) {
                      if (board.isMated) {
                          endMsg = if (board.sideToMove == botSide) (if (mode == 3) "Mat oldum ✓ (hedef tamam)" else "Oyun bitti: mat, kaybettim") else "Oyun bitti: mat, kazandım ✓"
                          break
                      }
                      if (board.isDraw) { endMsg = "Oyun bitti: beraberlik"; break }

                      if (board.sideToMove == botSide && sent == null) {
                          if (mode == 3) {
                              setStatus("Mat olmak için hamle arıyorum…")
                              val pk = pickSuicide(board)
                              if (!running) break
                              if (pk == null) { setStatus("Hamle bulunamadı"); break }
                              playMove(pk.first)
                              sent = pk.first
                              sentAt = System.currentTimeMillis()
                              retries = 0
                              lastBest = -2
                              lastCount = 0
                              setStatus("Mat avı: ${uciOf(pk.first)} (${pk.second})")
                              Thread.sleep(700)
                              continue
                          }
                          setStatus(if (mode == 1) "Av ${ourMoves + 1}/$target: düşünüyor…" else "Düşünüyor…")
                          val lines = engine.analyze(board.fen, moveTime, if (mode == 1) 5 else 1)
                          if (!running) break
                          if (lines == null || lines.isEmpty()) { setStatus("Motor hamle üretemedi"); break }
                          val pick = if (mode == 1) pickFarm(board, lines, ourMoves, target, botSide) else null
                          val mv = if (mode == 1) pick?.first else findMove(board, lines[0].move)
                          val ptag = pick?.second ?: ""
                          if (ptag == "‼") brill++ else if (ptag == "!") great++
                          if (mv == null) { setStatus("Motor hamlesi anlaşılamadı: ${lines[0].move}"); break }
                          playMove(mv)
                          sent = mv
                          sentAt = System.currentTimeMillis()
                          retries = 0
                          lastBest = -2
                          lastCount = 0
                          val tag = if (mode == 1) "Av ${ourMoves + 1}/$target · ‼$brill !$great · " + (if (ptag.isNotEmpty()) "$ptag aday · " else "") else ""
                          setStatus("$tag${uciOf(mv)} (${Engine.evalText(lines[0])})")
                          Thread.sleep(700)
                          continue
                      }

                      val cur = screenshot()
                      if (cur == null) { Thread.sleep(500); continue }
                      val d = reader.distances(cur)

                      val cands = ArrayList<Move?>()
                      cands.add(null)
                      val sm = sent
                      if (sm != null) cands.add(sm) else cands.addAll(board.legalMoves())

                      var bi = 0
                      var b = Double.MAX_VALUE
                      var second = Double.MAX_VALUE
                      for (i in cands.indices) {
                          val s = score(d, placementAfter(board, cands[i]))
                          if (s < b) { second = b; b = s; bi = i } else if (s < second) second = s
                      }
                      val confident = (second - b) > 20.0

                      if (confident && bi != 0) {
                          if (bi == lastBest) lastCount++ else { lastBest = bi; lastCount = 1 }
                          if (lastCount >= 2) {
                              val mv = cands[bi]!!
                              val isMine = (sent != null)
                              board.doMove(mv)
                              if (isMine) {
                                  sent = null
                                  ourMoves++
                              } else {
                                  setStatus("Rakip: ${uciOf(mv)}")
                              }
                              lastBest = -2
                              lastCount = 0
                          }
                      } else {
                          lastBest = -2
                          lastCount = 0
                          val s2 = sent
                          if (s2 != null && confident && System.currentTimeMillis() - sentAt > 4000) {
                              retries++
                              if (retries > 2) { setStatus("Hamle oynanamadı, durdum (tahtayı kontrol et)"); break }
                              setStatus("Hamle tutmadı, tekrar deniyorum…")
                              playMove(s2)
                              sentAt = System.currentTimeMillis()
                          }
                      }
                      Thread.sleep(600)
                  }
                  if (endMsg != null) setStatus(endMsg + (if (mode == 1) "  (‼$brill  !$great aday)" else "")) else if (!running) setStatus("Durduruldu")
              }

              // ------------------------------------------------------------ Yön ve mat-ol modu

              /** Kör modda taşlar görünmez: rengi ayardan, koordinat rakamlarından veya (varsa) taşlardan bulur. */
              private fun resolveOrientation(bmp: Bitmap): String? {
                  when (prefs().getInt("color", 0)) {
                      1 -> { reader.whiteBottom = true; return null }
                      2 -> { reader.whiteBottom = false; return null }
                  }
                  val byLabel = reader.orientationFromLabels(bmp)
                  if (byLabel != null) { reader.whiteBottom = byLabel; return null }
                  val err = reader.checkStart(bmp)
                  return if (err == null) null else "Rengi anlayamadım. Panelden Renk: Beyaz veya Siyah seç."
              }

              private class Cand(val m: Move, val r: Int, val mates: Int)

              /**
               * Zorunlu "mat ol" araması: öyle bir hamle bul ki rakibin HER cevabından sonra (cevap zaten mat değilse)
               * en fazla [n] hamlede rakibin tüm hamleleri bizi mat etsin. Rakip kaçınsa bile kurtulamaz.
               * n=1: rakibin bütün hamleleri mat. n=2/3: rakibe az seçenek bırakan (şah çeken vb.) hamleler denenir.
               */
              private fun selfMate(board: Board, n: Int, deadline: Long): Move? {
                  val mine = board.legalMoves().toList()
                  for (m1 in mine) {
                      if (!running || System.currentTimeMillis() > deadline) return null
                      board.doMove(m1)
                      if (board.isMated || board.isDraw) { board.undoMove(); continue }
                      val replies = board.legalMoves().toList()
                      if (replies.isEmpty()) { board.undoMove(); continue }
                      var ok = false
                      if (n <= 1) {
                          ok = true
                          for (r in replies) {
                              board.doMove(r)
                              val mated = board.isMated
                              board.undoMove()
                              if (!mated) { ok = false; break }
                          }
                      } else if (replies.size <= (if (n == 2) 12 else 6)) {
                          ok = true
                          for (r in replies) {
                              if (System.currentTimeMillis() > deadline) { ok = false; break }
                              board.doMove(r)
                              var good = board.isMated
                              if (!good && !board.isDraw) good = selfMate(board, n - 1, deadline) != null
                              board.undoMove()
                              if (!good) { ok = false; break }
                          }
                      }
                      board.undoMove()
                      if (ok) return m1
                  }
                  return null
              }

              /**
               * Hızlı Mat Ol modu: kendimizi en hızlı şekilde mat ettirmeye çalışır.
               *  1) 1-3 hamlelik ZORUNLU mat (rakibin cevabı ne olursa olsun mat olunur) varsa onu oynar
               *  2) Yoksa rakibin mat hamlesi olan hamleler arasından mat oranı en yüksek olanı
               *  3) Hiçbiri yoksa Stockfish ile mata en yakın (yoksa en kötü değerlendirmeli) hamle
               * Rakibi mat eden veya beraberlik yapan hamlelerden kaçınır.
               */
              private fun pickSuicide(board: Board): Pair<Move, String>? {
                  val deadline = System.currentTimeMillis() + 6000
                  val all = board.legalMoves().toList()
                  val cands = ArrayList<Cand>()
                  for (m in all) {
                      board.doMove(m)
                      if (!board.isMated && !board.isDraw) {
                          val rep = board.legalMoves().toList()
                          if (rep.isNotEmpty()) {
                              var mates = 0
                              for (r in rep) {
                                  board.doMove(r)
                                  if (board.isMated) mates++
                                  board.undoMove()
                              }
                              cands.add(Cand(m, rep.size, mates))
                          }
                      }
                      board.undoMove()
                  }
                  if (cands.isEmpty()) return all.firstOrNull()?.let { Pair(it, "") }

                  for (n in 1..3) {
                      val f = selfMate(board, n, deadline)
                      if (f != null) return Pair(f, "zorunlu mat $n hamle")
                      if (System.currentTimeMillis() > deadline) break
                  }

                  var bestC: Cand? = null
                  var bestRatio = -1.0
                  for (c in cands) {
                      if (c.mates == 0) continue
                      val ratio = c.mates.toDouble() / c.r - c.r * 0.0001
                      if (ratio > bestRatio) { bestRatio = ratio; bestC = c }
                  }
                  val bc = bestC
                  if (bc != null) return Pair(bc.m, "mat şansı ${bc.mates}/${bc.r}")

                  var best: Move? = null
                  var bestKey = Double.MAX_VALUE
                  var bestTxt = ""
                  val fen = board.fen
                  for (c in cands) {
                      if (!running) break
                      val l = engine.evalMove(fen, uciOf(c.m), 10, 250) ?: continue
                      val mt = l.mate
                      val key = when {
                          mt != null && mt < 0 -> (-mt).toDouble()
                          mt != null -> 10000.0 + mt
                          else -> 1000.0 + (l.cp ?: 0) / 100.0
                      }
                      val k2 = key + c.r * 0.001
                      if (k2 < bestKey) { bestKey = k2; best = c.m; bestTxt = Engine.evalText(l) }
                  }
                  return Pair(best ?: cands[0].m, bestTxt)
              }

              // ------------------------------------------------------------ Kör satranç

              private fun sgn(v: Int): Int = if (v > 0) 1 else if (v < 0) -1 else 0

              /** Bir hamlenin ekranda iz bırakabileceği kareler: kaynak, hedef, yol, rok kalesi, en passant piyonu. */
              private fun footprint(board: Board, m: Move): Set<Int> {
                  val from = sqIdx(m.from.name)
                  val to = sqIdx(m.to.name)
                  val out = HashSet<Int>()
                  out.add(from)
                  out.add(to)
                  val df = to % 8 - from % 8
                  val dr = to / 8 - from / 8
                  val steps = max(abs(df), abs(dr))
                  if (steps > 1 && (df == 0 || dr == 0 || abs(df) == abs(dr))) {
                      for (i in 1 until steps) out.add((from / 8 + sgn(dr) * i) * 8 + (from % 8 + sgn(df) * i))
                  }
                  val piece = board.getPiece(m.from)
                  if (piece.pieceType == PieceType.KING && dr == 0 && abs(df) == 2) {
                      val rank = from / 8
                      if (df > 0) { out.add(rank * 8 + 7); out.add(rank * 8 + 5) } else { out.add(rank * 8); out.add(rank * 8 + 3) }
                  }
                  if (piece.pieceType == PieceType.PAWN && df != 0 && board.getPiece(m.to) == Piece.NONE) {
                      out.add((from / 8) * 8 + to % 8)
                  }
                  return out
              }

              private fun moveMatches(m: Move, ev: FloatArray): Boolean {
                  val ef = ev[sqIdx(m.from.name)]
                  val et = ev[sqIdx(m.to.name)]
                  return (ef >= 0.10f && et >= 0.10f) || (et >= 0.15f && ef >= 0.04f)
              }

              /** Anlık görünen taşın izlerinden (ev) rakibin hangi hamleyi yaptığını bulur; emin değilse null. */
              private fun bestOpponentMove(board: Board, ev: FloatArray): Move? {
                  val reps = LinkedHashMap<Int, Move>()
                  for (m in board.legalMoves()) {
                      if (!moveMatches(m, ev)) continue
                      val key = sqIdx(m.from.name) * 64 + sqIdx(m.to.name)
                      val cur = reps[key]
                      if (cur == null || (m.promotion != Piece.NONE && m.promotion.fenSymbol.lowercase() == "q")) reps[key] = m
                  }
                  if (reps.isEmpty()) return null
                  var best: Move? = null
                  var bs = -1e9f
                  var s2 = -1e9f
                  for (m in reps.values) {
                      val fp = footprint(board, m)
                      var other = 0f
                      for (sq in 0 until 64) if (ev[sq] >= 0.12f && !fp.contains(sq)) other += ev[sq]
                      val sc = ev[sqIdx(m.from.name)] + ev[sqIdx(m.to.name)] - 0.5f * other
                      if (sc > bs) { s2 = bs; bs = sc; best = m } else if (sc > s2) s2 = sc
                  }
                  if (reps.size > 1 && bs - s2 < 0.03f) return null
                  return best
              }

              // --- Ekrandaki hamle yazısını (SAN: Nf3, exd5, O-O ...) okuma

              private val sanRe = Regex("^(O-O-O|O-O|0-0-0|0-0|[KQRBN]?[a-h]?[1-8]?x?[a-h][1-8](=[QRBN])?)[+#]?[!?]*$")
              private val numRe = Regex("^\\d+\\.+")
              private val wsRe = Regex("\\s+")

              private fun figurineToLetters(s: String): String {
                  val sb = StringBuilder()
                  for (ch in s) {
                      when (ch) {
                          '♔', '♚' -> sb.append('K')
                          '♕', '♛' -> sb.append('Q')
                          '♖', '♜' -> sb.append('R')
                          '♗', '♝' -> sb.append('B')
                          '♘', '♞' -> sb.append('N')
                          '♙', '♟' -> {}
                          else -> sb.append(ch)
                      }
                  }
                  return sb.toString()
              }

              private fun sanTokens(texts: List<String>): List<String> {
                  val out = ArrayList<String>()
                  for (t0 in texts) {
                      for (raw in figurineToLetters(t0).split(wsRe)) {
                          val p = raw.replace(numRe, "").trim()
                          if (p.length >= 2 && sanRe.matches(p)) out.add(p)
                      }
                  }
                  return out
              }

              /** Erişilebilirlik ağacındaki (chess.com uygulamasının ekranındaki) tüm yazılar. */
              private fun collectTexts(): List<String> {
                  val out = ArrayList<String>()
                  fun walk(n: AccessibilityNodeInfo?, d: Int) {
                      if (n == null || d > 60) return
                      n.text?.let { out.add(it.toString()) }
                      n.contentDescription?.let { out.add(it.toString()) }
                      for (i in 0 until n.childCount) walk(n.getChild(i), d + 1)
                  }
                  try { walk(rootInActiveWindow, 0) } catch (_: Exception) {}
                  return out
              }

              /** Yedek: ekran görüntüsünde (tahta hariç) yazı tanıma (OCR). */
              private fun ocrTokens(shot: Bitmap): List<String> {
                  return try {
                      val bmp = shot.copy(Bitmap.Config.ARGB_8888, true)
                      val c = Canvas(bmp)
                      val p = Paint().apply { color = Color.BLACK }
                      c.drawRect(reader.x0, reader.y0, reader.x1, reader.y1, p)
                      val rec = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
                      val res = Tasks.await(rec.process(InputImage.fromBitmap(bmp, 0)), 8, TimeUnit.SECONDS)
                      rec.close()
                      sanTokens(listOf(res.text))
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              private fun multiset(list: List<String>): HashMap<String, Int> {
                  val h = HashMap<String, Int>()
                  for (t in list) h[t] = (h[t] ?: 0) + 1
                  return h
              }

              /** Önceki görüntüde (seen) olmayan, yeni çıkan hamle yazıları (ekrandaki sırayla). */
              private fun newTokens(cur: List<String>, seen: Map<String, Int>): MutableList<String> {
                  val tmp = HashMap<String, Int>(seen)
                  val out = ArrayList<String>()
                  for (t in cur) {
                      val c = tmp[t] ?: 0
                      if (c > 0) tmp[t] = c - 1 else out.add(t)
                  }
                  return out
              }

              /** Hamle yazısının hedefi: kare numarası, -2 = kısa rok, -3 = uzun rok, -1 = anlaşılmadı. */
              private fun tokDestCode(tok: String): Int {
                  var t = tok.trimEnd('+', '#', '!', '?')
                  if (t == "O-O" || t == "0-0") return -2
                  if (t == "O-O-O" || t == "0-0-0") return -3
                  val eq = t.indexOf('=')
                  if (eq >= 0) t = t.substring(0, eq)
                  if (t.length < 2) return -1
                  return sqIdx(t.substring(t.length - 2))
              }

              private fun moveDestCode(board: Board, m: Move): Int {
                  val from = sqIdx(m.from.name)
                  val to = sqIdx(m.to.name)
                  if (board.getPiece(m.from).pieceType == PieceType.KING && from / 8 == to / 8 && abs(to % 8 - from % 8) == 2) {
                      return if (to % 8 > from % 8) -2 else -3
                  }
                  return to
              }

              /** Hamle yazısına uyan yasal hamleler (aynı kare çifti tekilleştirilir, terfide vezir seçilir). */
              private fun sanCandidateMoves(board: Board, tok: String): List<Move> {
                  val legal = board.legalMoves().toList()
                  var t = tok.trimEnd('+', '#', '!', '?')
                  val matched = ArrayList<Move>()
                  if (t == "O-O" || t == "0-0" || t == "O-O-O" || t == "0-0-0") {
                      val short = (t == "O-O" || t == "0-0")
                      for (m in legal) {
                          val from = sqIdx(m.from.name)
                          val to = sqIdx(m.to.name)
                          if (board.getPiece(m.from).pieceType == PieceType.KING && from / 8 == to / 8 &&
                              abs(to % 8 - from % 8) == 2 && ((to % 8 > from % 8) == short)
                          ) matched.add(m)
                      }
                  } else {
                      var promo = ' '
                      val eq = t.indexOf('=')
                      if (eq >= 0 && eq + 1 < t.length) { promo = t[eq + 1]; t = t.substring(0, eq) }
                      if (t.length < 2) return emptyList()
                      val toSq = sqIdx(t.substring(t.length - 2))
                      var rest = t.substring(0, t.length - 2)
                      if (rest.endsWith("x")) rest = rest.dropLast(1)
                      var pt: PieceType? = null
                      if (rest.isNotEmpty() && "KQRBN".indexOf(rest[0]) >= 0) {
                          pt = when (rest[0]) {
                              'K' -> PieceType.KING
                              'Q' -> PieceType.QUEEN
                              'R' -> PieceType.ROOK
                              'B' -> PieceType.BISHOP
                              else -> PieceType.KNIGHT
                          }
                          rest = rest.substring(1)
                      }
                      var hf = -1
                      var hr = -1
                      for (ch in rest) {
                          if (ch in 'a'..'h') hf = ch - 'a' else if (ch in '1'..'8') hr = ch - '1'
                      }
                      val ptv = pt
                      val hfv = hf
                      val hrv = hr
                      val promoV = promo
                      fun pass(pawnOnly: Boolean): List<Move> = legal.filter { m ->
                          if (sqIdx(m.to.name) != toSq) return@filter false
                          val from = sqIdx(m.from.name)
                          val mt = board.getPiece(m.from).pieceType
                          if (ptv != null) {
                              if (mt != ptv) return@filter false
                          } else if (pawnOnly && mt != PieceType.PAWN) return@filter false
                          if (hfv >= 0 && from % 8 != hfv) return@filter false
                          if (hrv >= 0 && from / 8 != hrv) return@filter false
                          if (promoV != ' ' && m.promotion != Piece.NONE && m.promotion.fenSymbol.uppercase() != promoV.toString()) return@filter false
                          true
                      }
                      matched.addAll(pass(true))
                      if (matched.isEmpty() && ptv == null) matched.addAll(pass(false))
                  }
                  val reps = LinkedHashMap<Int, Move>()
                  for (m in matched) {
                      val key = sqIdx(m.from.name) * 64 + sqIdx(m.to.name)
                      val cur = reps[key]
                      if (cur == null || (m.promotion != Piece.NONE && m.promotion.fenSymbol.lowercase() == "q")) reps[key] = m
                  }
                  return reps.values.toList()
              }

              /**
               * Kör mod: Taşlar görünmez. Konumu hafızada (iç tahta) tutar. Rakibin hamlesini 3 yoldan okur:
               *  1) Ekrandaki hamle yazısı (chess.com kör modda rakibin son hamlesini yazıyla gösterir): erişilebilirlik ağacından
               *  2) Aynı yazı görünmüyorsa ekran görüntüsünde yazı tanıma (OCR)
               *  3) Taşın hareket ederken anlık görünmesi (hızlı yakalama ile saniyede ~30 kare)
               * Yazı sadece hedef kareyi verir (örn. Nf3); hangi taşın gittiğini hafızadaki yasal hamleler belirler.
               */
              private fun runBlind(first: Bitmap, moveTime: Int) {
                  resolveOrientation(first)?.let { setStatus(it); return }
                  val board = Board()
                  val botSide = if (reader.whiteBottom) Side.WHITE else Side.BLACK
                  engine.newGame()

                  FrameHub.rect = floatArrayOf(reader.x0, reader.y0, reader.x1 - reader.x0)
                  val base = reader.frac(reader.gridFromBitmap(first))
                  if (FrameHub.active) {
                      // Taşlar başta görünüyorsa sonradan gizlenir: ilk ~0.8 sn'deki en düşük değeri zemin say
                      val t0 = System.currentTimeMillis()
                      while (running && System.currentTimeMillis() - t0 < 800) {
                          for (f in FrameHub.drain()) {
                              val fr = reader.frac(f.grid)
                              for (i in 0 until 64) if (fr[i] < base[i]) base[i] = fr[i]
                          }
                          Thread.sleep(20)
                      }
                  }
                  FrameHub.clear()

                  var sent: Move? = null
                  var sentAt = 0L
                  var lastOwnDest = -1
                  var ownPending = false
                  var ownShown: Boolean? = null
                  var ownTokenSeen = false
                  var needDropOwn = false
                  var retries = 0
                  var unresolved = 0
                  var curTokens: List<String> = emptyList()
                  var lastOcrTokens: List<String> = emptyList()
                  var lastTextPoll = 0L
                  var lastOcr = 0L
                  var lastDbg = 0L
                  var waitStart = System.currentTimeMillis()
                  val ev = FloatArray(64)
                  var eventActive = false
                  var eventStart = 0L
                  var lastActive = 0L
                  var endMsg: String? = null

                  fun pollTokens(allowOcr: Boolean) {
                      val now0 = System.currentTimeMillis()
                      var t = sanTokens(collectTexts())
                      if (t.isEmpty() && allowOcr && now0 - lastOcr > 2000) {
                          lastOcr = now0
                          val shot = screenshot()
                          if (shot != null) lastOcrTokens = ocrTokens(shot)
                      }
                      if (t.isEmpty()) t = lastOcrTokens
                      curTokens = t
                  }

                  pollTokens(false)
                  var seen: Map<String, Int> = multiset(curTokens)
                  setStatus(
                      if (FrameHub.active) "Kör mod: yazı + hızlı yakalama açık, hafızadan oynuyorum"
                      else "Kör mod: yazıyı okuyorum (hızlı yakalama kapalı, anlık taşları kaçırabilirim)"
                  )

                  while (running) {
                      if (board.isMated) {
                          endMsg = if (board.sideToMove == botSide) "Oyun bitti: mat, kaybettim" else "Oyun bitti: mat, kazandım ✓"
                          break
                      }
                      if (board.isDraw) { endMsg = "Oyun bitti: beraberlik"; break }

                      if (board.sideToMove == botSide && sent == null) {
                          setStatus("Kör: düşünüyor…")
                          val lines = engine.analyze(board.fen, moveTime, 1)
                          if (!running) break
                          if (lines == null || lines.isEmpty()) { setStatus("Motor hamle üretemedi"); break }
                          val mv = findMove(board, lines[0].move)
                          if (mv == null) { setStatus("Motor hamlesi anlaşılamadı: ${lines[0].move}"); break }
                          pollTokens(false)
                          seen = multiset(curTokens)
                          FrameHub.clear()
                          java.util.Arrays.fill(ev, 0f)
                          eventActive = false
                          lastOwnDest = moveDestCode(board, mv)
                          playMove(mv)
                          sent = mv
                          sentAt = System.currentTimeMillis()
                          retries = 0
                          ownPending = true
                          ownTokenSeen = false
                          needDropOwn = false
                          setStatus("Kör: ${uciOf(mv)} (${Engine.evalText(lines[0])})")
                          continue
                      }

                      // 1) Görsel kareler: anlık görünen taşlar
                      var frames: List<FrameHub.GridFrame> = emptyList()
                      if (FrameHub.active) {
                          frames = FrameHub.drain()
                          if (frames.isEmpty()) Thread.sleep(12)
                      } else {
                          Thread.sleep(40)
                      }
                      for (f in frames) {
                          val fr = reader.frac(f.grid)
                          var act = false
                          for (sq in 0 until 64) {
                              val p = fr[sq] - base[sq]
                              if (p > 0.12f) {
                                  act = true
                                  if (p > ev[sq]) ev[sq] = p
                              }
                          }
                          if (act) {
                              if (!eventActive) { eventActive = true; eventStart = f.ts }
                              lastActive = f.ts
                          }
                      }
                      val now = System.currentTimeMillis()
                      val eventDone = eventActive && (now - lastActive > 450 || now - eventStart > 2500)

                      // 2) Metin: hamle yazıları
                      if (now - lastTextPoll >= 350) {
                          lastTextPoll = now
                          pollTokens(now - waitStart > 3000)
                      }

                      val sm = sent
                      if (sm != null) {
                          // Kendi hamlemizin oynandığını anla
                          var confirmed = false
                          if (ownPending) {
                              val nt = newTokens(curTokens, seen)
                              val idx = nt.indexOfFirst { tokDestCode(it) == lastOwnDest }
                              if (idx >= 0) {
                                  val h = HashMap<String, Int>(seen)
                                  h[nt[idx]] = (h[nt[idx]] ?: 0) + 1
                                  seen = h
                                  ownShown = true
                                  ownTokenSeen = true
                                  ownPending = false
                                  confirmed = true
                              } else if (now - sentAt > 1800) {
                                  ownPending = false
                                  if (ownShown == null && curTokens.isNotEmpty()) ownShown = false
                              }
                          }
                          if (!confirmed && eventDone && moveMatches(sm, ev)) {
                              val fp = footprint(board, sm)
                              for (sq in fp) ev[sq] = 0f
                              var extra = false
                              for (sq in 0 until 64) if (ev[sq] >= 0.12f) extra = true
                              if (extra) { eventActive = true; lastActive = 0L } else { eventActive = false }
                              confirmed = true
                          }
                          if (!confirmed && now - sentAt > 3500 && !eventActive) confirmed = true
                          if (confirmed) {
                              board.doMove(sm)
                              sent = null
                              ownPending = false
                              if (ownShown == true && !ownTokenSeen) needDropOwn = true
                              unresolved = 0
                              waitStart = now
                          }
                      } else {
                          // Rakibin hamlesini bul
                          var chosen: Move? = null
                          if (curTokens.isNotEmpty()) {
                              val nt = newTokens(curTokens, seen)
                              if (needDropOwn) {
                                  val idx = nt.indexOfFirst { tokDestCode(it) == lastOwnDest }
                                  if (idx >= 0) nt.removeAt(idx)
                              }
                              for (t in nt.asReversed()) {
                                  val opts = sanCandidateMoves(board, t)
                                  if (opts.isEmpty()) continue
                                  if (opts.size == 1) { chosen = opts[0]; break }
                                  val vis = opts.filter { ev[sqIdx(it.from.name)] >= 0.04f || ev[sqIdx(it.to.name)] >= 0.10f }
                                  if (vis.size == 1) { chosen = vis[0]; break }
                              }
                          }
                          if (chosen == null && eventDone) chosen = bestOpponentMove(board, ev)
                          if (chosen != null) {
                              board.doMove(chosen)
                              setStatus("Rakip: ${uciOf(chosen)}")
                              seen = multiset(curTokens)
                              needDropOwn = false
                              java.util.Arrays.fill(ev, 0f)
                              eventActive = false
                              unresolved = 0
                              waitStart = now
                          } else if (eventDone) {
                              unresolved++
                              java.util.Arrays.fill(ev, 0f)
                              eventActive = false
                              if (unresolved >= 8) {
                                  setStatus("Rakibin hamlesini anlayamadım (senkron bozuldu), durdum.")
                                  break
                              }
                          } else if (now - lastDbg > 6000) {
                              lastDbg = now
                              val seenTxt = if (curTokens.isEmpty()) "ekranda hamle yazısı yok" else curTokens.takeLast(4).joinToString(" ")
                              setStatus("Rakip bekleniyor… ($seenTxt)")
                          }
                      }
                  }
                  if (endMsg != null) setStatus(endMsg) else if (!running) setStatus("Durduruldu")
              }
          }
          CHESSBOT_EOF
          mkdir -p app/src/main/java/com/wex1n/chessbot
          cat > app/src/main/java/com/wex1n/chessbot/MainActivity.kt <<'CHESSBOT_EOF'
