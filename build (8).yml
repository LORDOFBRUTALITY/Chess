              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun rounded(color: Int, stroke: Int, radiusDp: Int = 16): GradientDrawable =
                  GradientDrawable().apply {
                      setColor(color)
                      cornerRadius = dp(radiusDp).toFloat()
                      if (stroke != 0) setStroke(dp(2), stroke)
                  }

              private fun label(t: String, size: Float, color: Int, bold: Boolean = false): TextView =
                  TextView(this).apply {
                      text = t
                      textSize = size
                      setTextColor(color)
                      if (bold) typeface = Typeface.DEFAULT_BOLD
                  }

              private fun lpMatch(top: Int = 0): LinearLayout.LayoutParams =
                  LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                      topMargin = dp(top)
                  }

              private fun card(): LinearLayout =
                  LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(14), dp(16), dp(14))
                      background = rounded(cCard, 0)
                  }

              private fun modeCard(title: String, desc: String, mode: Int): LinearLayout =
                  card().apply {
                      addView(label(title, 17f, Color.WHITE, true))
                      addView(label(desc, 13f, cDim).apply { setPadding(0, dp(4), 0, 0) })
                      setOnClickListener {
                          prefs.edit().putInt("mode", mode).apply()
                          refreshMode()
                      }
                  }

              private fun refreshMode() {
                  val m = prefs.getInt("mode", 0)
                  cardNormal.background = rounded(cCard, if (m == 0) cAccent else 0x22FFFFFF)
                  cardFarm.background = rounded(cCard, if (m == 1) cAccent else 0x22FFFFFF)
                  cardBlind.background = rounded(cCard, if (m == 2) cAccent else 0x22FFFFFF)
                  cardSuicide.background = rounded(cCard, if (m == 3) cAccent else 0x22FFFFFF)
                  farmBox.visibility = if (m == 1) View.VISIBLE else View.GONE
              }

              private fun button(text: String, color: Int, onClick: () -> Unit): TextView =
                  TextView(this).apply {
                      this.text = text
                      textSize = 15f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setPadding(dp(14), dp(13), dp(14), dp(13))
                      background = rounded(color, 0, 12)
                      setOnClickListener { onClick() }
                  }

              private fun addSlider(
                  parent: LinearLayout, max: Int, progress: Int,
                  text: (Int) -> String, onChange: (Int) -> Unit
              ) {
                  val tv = label(text(progress), 14f, Color.WHITE).apply { setPadding(0, dp(10), 0, dp(2)) }
                  val bar = SeekBar(this).apply {
                      this.max = max
                      this.progress = progress
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(sb: SeekBar?, p: Int, fromUser: Boolean) {
                              tv.text = text(p)
                              onChange(p)
                          }
                          override fun onStartTrackingTouch(sb: SeekBar?) {}
                          override fun onStopTrackingTouch(sb: SeekBar?) {}
                      })
                  }
                  parent.addView(tv)
                  parent.addView(bar)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = getSharedPreferences("chessbot", MODE_PRIVATE)
                  window.statusBarColor = cBg
                  window.navigationBarColor = cBg

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(28), dp(16), dp(28))
                      setBackgroundColor(cBg)
                  }
                  root.addView(label("♞ ChessBot", 30f, Color.WHITE, true))
                  root.addView(label("Satranç asistanı", 14f, cDim))

                  // --- Modlar
                  root.addView(label("MOD", 12f, cAccent, true).apply { setPadding(0, dp(22), 0, dp(8)) })
                  cardNormal = modeCard(
                      "Normal (sıfır hata)",
                      "Her hamlede Stockfish'in en iyi hamlesini oynar, en hızlı şekilde kazanmaya gider.", 0
                  )
                  cardFarm = modeCard(
                      "Parlak ‼ / Harika ! Hamle Avı",
                      "chess.com'un turkuaz Parlak (‼) ve mavi Harika (!) hamle etiketlerini avlar: tek iyi hamleleri ve sağlam fedakarlıkları arar, yoksa en iyiye denk hamlelerle taşları tahtada tutup oyunu uzatır. Hedef hamleye gelince oyunu bitirip kazanır.", 1
                  )
                  cardBlind = modeCard(
                      "Kör Satranç",
                      "Taşlar gizliyken oynar. Konumu hafızasında tutar. Rakibin hamlesini ekranda yazan hamle notasyonundan (Nf3 gibi), olmazsa yazı tanımadan, ayrıca taş hareket ederken anlık görünmesinden okur. Hızlı Yakalama'yı açmak güvenliyi artırır.", 2
                  )
                  root.addView(cardNormal, lpMatch())
                  root.addView(cardFarm, lpMatch(10))
                  cardSuicide = modeCard(
                      "Hızlı Mat Ol",
                      "Kendini en hızlı şekilde mat ettirmeye çalışır. Rakibin tüm hamlelerinin mat olduğu (zorunlu) konumları arar, yoksa mata en kısa yoldan gideni seçer.", 3
                  )
                  root.addView(cardBlind, lpMatch(10))
                  root.addView(cardSuicide, lpMatch(10))

                  // --- Ayarlar
                  root.addView(label("AYARLAR", 12f, cAccent, true).apply { setPadding(0, dp(22), 0, dp(8)) })
                  val settings = card()
                  addSlider(settings, 9, (prefs.getInt("movetime", 1500) - 500) / 500,
                      { "Hamle başına düşünme süresi: ${500 + it * 500} ms" },
                      { prefs.edit().putInt("movetime", 500 + it * 500).apply() })

                  farmBox = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  addSlider(farmBox, 16, (prefs.getInt("target", 50) - 20) / 5,
                      { "Av hedefi: ${20 + it * 5} hamle (sonra oyunu bitirir)" },
                      { prefs.edit().putInt("target", 20 + it * 5).apply() })
                  settings.addView(farmBox)
                  root.addView(settings, lpMatch())

                  // --- Hızlı yakalama (kör mod)
                  root.addView(label("HIZLI YAKALAMA (KÖR MOD)", 12f, cAccent, true).apply { setPadding(0, dp(22), 0, dp(8)) })
                  val capCard = card()
                  capCard.addView(label("Kör modda taşlar sadece hareket ederken anlık görünür. Bu yüzden ekranı saniyede ~30 kare izlemek gerekir. Oyuna başlamadan önce aç (izin penceresi çıkar).", 13f, cDim))
                  val ct = label("", 14f, cAccent).apply { setPadding(0, dp(8), 0, 0) }
                  capTv = ct
                  capCard.addView(ct)
                  root.addView(capCard, lpMatch())
                  root.addView(button("⚡ Hızlı Yakalamayı Başlat", 0xFF2D4A7A.toInt()) {
                      val mgr = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      startActivityForResult(mgr.createScreenCaptureIntent(), 77)
                  }, lpMatch(10))
                  root.addView(button("Yakalamayı Durdur", 0xFF33363C.toInt()) {
                      stopService(Intent(this, CaptureService::class.java))
                      capTv?.postDelayed({ refreshCap() }, 500)
                  }, lpMatch(10))

                  // --- Kurulum
                  root.addView(label("KURULUM", 12f, cAccent, true).apply { setPadding(0, dp(22), 0, dp(8)) })
                  val setup = card()
                  setup.addView(label(
                      "1) Erişilebilirlik'ten ChessBot'u aç (Android 13+: Uygulama bilgisi > ⋮ > Kısıtlı ayarlara izin ver).\n" +
                          "2) chess.com'u bot hesabıyla aç, ekranda ChessBot paneli çıkar. Panelden modu seç (Kör modda taşlar gizliyse Renk: Beyaz/Siyah de seç).\n" +
                          "3) Oyunun ilk anında (taşlar yerindeyken) ▶ Başlat'a bas. Tahtayı kendisi bulur, kalibrasyon gerekmez.\n" +
                          "4) Panel oyun sırasında küçük bir noktaya iner; noktaya dokunursan açılır. ✕ ile her zaman küçültebilirsin.\n\n" +
                          "İpucu: Tahta temasını düz renkli yap. Panelde 🔍 tahtayı gösterir, uzun basarsan elle kalibre eder.",
                      13f, cDim
                  ))
                  root.addView(setup, lpMatch())

                  val status = label("", 14f, cAccent).apply { setPadding(0, dp(12), 0, 0) }
                  root.addView(button("Erişilebilirlik Ayarlarını Aç", 0xFF3F8F3A.toInt()) {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }, lpMatch(14))
                  root.addView(button("Motoru (Stockfish) Test Et", 0xFF33363C.toInt()) {
                      status.text = "Test ediliyor…"
                      Thread {
                          val e = Engine(this@MainActivity)
                          val r = e.start()
                          e.quit()
                          runOnUiThread { status.text = r ?: "Stockfish çalışıyor ✓" }
                      }.start()
                  }, lpMatch(10))
                  root.addView(status)

                  refreshMode()
                  setContentView(ScrollView(this).apply {
                      setBackgroundColor(cBg)
                      addView(root)
                  })
              }

              private fun refreshCap() {
                  capTv?.text = if (FrameHub.active) "Hızlı yakalama: AÇIK ✓" else "Hızlı yakalama: kapalı"
              }

              override fun onResume() {
                  super.onResume()
                  refreshCap()
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 77 && resultCode == RESULT_OK && data != null) {
                      val i = Intent(this, CaptureService::class.java)
                      i.putExtra("code", resultCode)
                      i.putExtra("data", data)
                      startForegroundService(i)
                      capTv?.postDelayed({ refreshCap() }, 900)
                  }
              }
          }
          CHESSBOT_EOF

      - name: Sabit imza anahtarı (güncelleme üstüne kurulabilsin)
        run: |
          mkdir -p ~/.android
          echo '' | base64 -d > ~/.android/debug.keystore

      - name: Stockfish'i Android (arm64) için derle
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          curl -L -o sf.tar.gz https://github.com/official-stockfish/Stockfish/archive/refs/tags/sf_17.tar.gz
          tar xzf sf.tar.gz
          cd Stockfish-sf_17/src
          make -j4 build ARCH=armv8 COMP=ndk
          llvm-strip stockfish || true
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp stockfish "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libstockfish.so"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: chessbot-apk
          path: app/build/outputs/apk/debug/app-debug.apk
