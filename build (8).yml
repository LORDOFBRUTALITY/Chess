          package com.wex1n.chessbot

          import java.util.concurrent.ConcurrentLinkedQueue

          /** Hızlı ekran yakalamadan (CaptureService) gelen tahta örnek karelerinin ortak kuyruğu. */
          object FrameHub {
              const val G = 96   // tahta boyunca 96x96 örnek (kare başına 12x12)

              class GridFrame(val ts: Long, val grid: IntArray)

              /** [x0, y0, kenar] — tahta konumu (piksel). */
              @Volatile var rect: FloatArray? = null
              @Volatile var active = false

              private val q = ConcurrentLinkedQueue<GridFrame>()

              fun push(f: GridFrame) {
                  q.add(f)
                  while (q.size > 300) q.poll()
              }

              fun drain(): List<GridFrame> {
                  val out = ArrayList<GridFrame>()
                  while (true) {
                      val f = q.poll() ?: break
                      out.add(f)
                  }
                  return out
              }

              fun clear() { q.clear() }
          }
