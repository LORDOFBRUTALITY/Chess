          class MainActivity : Activity() {
              private val cBg = 0xFF121316.toInt()
              private val cCard = 0xFF1E2024.toInt()
              private val cAccent = 0xFF81B64C.toInt()
              private val cDim = 0xFFA0A4AB.toInt()

