          package com.wex1n.chessbot

          import android.content.Context
          import java.io.BufferedReader
          import java.io.BufferedWriter
          import java.io.File
          import java.util.Locale

          /** Stockfish'i (libstockfish.so) ayrı süreç olarak çalıştırıp UCI ile konuşur. */
          class Engine(private val ctx: Context) {
              private var proc: Process? = null
              private var writer: BufferedWriter? = null
              private var reader: BufferedReader? = null

              /** Bir analiz satırı: hamle + değerlendirme (cp = santipiyon, mate = mat sayısı; sıra bizdeyken bizim açımızdan) */
              class Line(val move: String, val cp: Int?, val mate: Int?, val pv: List<String> = emptyList())

              companion object {
                  fun evalText(l: Line): String {
                      val m = l.mate
                      val c = l.cp
                      return when {
                          m != null -> "M$m"
                          c != null -> String.format(Locale.US, "%+.2f", c / 100.0)
                          else -> ""
                      }
                  }
              }

              @Synchronized
              fun start(): String? {
                  if (proc?.isAlive == true) return null
                  val f = File(ctx.applicationInfo.nativeLibraryDir, "libstockfish.so")
                  if (!f.exists()) return "Stockfish bulunamadı (libstockfish.so)"
                  return try {
                      val p = ProcessBuilder(f.absolutePath).redirectErrorStream(true).start()
                      proc = p
                      writer = p.outputStream.bufferedWriter()
                      reader = p.inputStream.bufferedReader()
                      send("uci")
                      if (!waitFor("uciok")) return "Motor yanıt vermedi"
                      val threads = Runtime.getRuntime().availableProcessors().coerceIn(1, 4)
                      send("setoption name Threads value $threads")
                      send("setoption name Hash value 64")
                      send("isready")
                      if (!waitFor("readyok")) return "Motor hazır olmadı"
                      null
                  } catch (e: Exception) {
                      "Motor başlatılamadı: ${e.message}"
                  }
              }

              @Synchronized
              private fun send(s: String) {
                  writer?.apply { write(s); write("\n"); flush() }
              }

              private fun waitFor(token: String): Boolean {
                  while (true) {
                      val line = reader?.readLine() ?: return false
                      if (line.startsWith(token)) return true
                  }
              }

              fun newGame() {
                  send("ucinewgame")
                  send("isready")
                  waitFor("readyok")
              }

              /** En iyi [multiPv] hamleyi değerlendirmeleriyle birlikte döndürür (iyiden kötüye). */
              fun analyze(fen: String, moveTimeMs: Int, multiPv: Int): List<Line>? {
                  send("setoption name MultiPV value $multiPv")
                  send("position fen $fen")
                  send("go movetime $moveTimeMs")
                  val map = HashMap<Int, Line>()
                  while (true) {
                      val line = reader?.readLine() ?: return null
                      if (line.startsWith("info") && line.contains(" pv ") && line.contains(" score ") && !line.contains("bound")) {
                          val t = line.split(" ")
                          val mi = t.indexOf("multipv")
                          val idx = if (mi >= 0 && mi + 1 < t.size) (t[mi + 1].toIntOrNull() ?: 1) else 1
                          val si = t.indexOf("score")
                          val pi = t.indexOf("pv")
                          if (si >= 0 && si + 2 < t.size && pi >= 0 && pi + 1 < t.size) {
                              val v = t[si + 2].toIntOrNull()
                              if (v != null) {
                                  val isMate = t[si + 1] == "mate"
                                  map[idx] = Line(t[pi + 1], if (isMate) null else v, if (isMate) v else null, t.drop(pi + 1).take(8))
                              }
                          }
                      }
                      if (line.startsWith("bestmove")) {
                          val mv = line.split(" ").getOrNull(1)
                          if (mv == null || mv == "(none)") return null
                          val out = map.toSortedMap().values.toMutableList()
                          if (out.isEmpty()) out.add(Line(mv, null, null))
                          return out
                      }
                  }
              }

              /** Sadece [uci] hamlesini değerlendirir (sıra bizdeyken, bizim açımızdan). */
              fun evalMove(fen: String, uci: String, depth: Int, maxMs: Int): Line? {
                  send("setoption name MultiPV value 1")
                  send("position fen $fen")
                  send("go depth $depth movetime $maxMs searchmoves $uci")
                  var last: Line? = null
                  while (true) {
                      val line = reader?.readLine() ?: return null
                      if (line.startsWith("info") && line.contains(" pv ") && line.contains(" score ") && !line.contains("bound")) {
                          val t = line.split(" ")
                          val si = t.indexOf("score")
                          val pi = t.indexOf("pv")
                          if (si >= 0 && si + 2 < t.size && pi >= 0 && pi + 1 < t.size) {
                              val v = t[si + 2].toIntOrNull()
                              if (v != null) {
                                  val isMate = t[si + 1] == "mate"
                                  last = Line(t[pi + 1], if (isMate) null else v, if (isMate) v else null)
                              }
                          }
                      }
                      if (line.startsWith("bestmove")) return last
                  }
              }

              fun stop() { send("stop") }

              fun quit() {
                  try { send("quit") } catch (_: Exception) {}
                  proc?.destroy()
                  proc = null
              }
          }
