              private fun attachDrag(v: View, onTap: (() -> Unit)?) {
                  var sx = 0f
                  var sy = 0f
                  var ox = 0
                  var oy = 0
                  var moved = 0f
                  v.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              sx = e.rawX; sy = e.rawY; ox = lp.x; oy = lp.y; moved = 0f
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              lp.x = ox + (e.rawX - sx).toInt()
                              lp.y = oy + (e.rawY - sy).toInt()
                              moved = max(moved, abs(e.rawX - sx) + abs(e.rawY - sy))
                              panel?.let { wm.updateViewLayout(it, lp) }
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              prefs().edit().putInt("px", lp.x).putInt("py", lp.y).apply()
                              if (moved < dp(8)) onTap?.invoke()
                              true
                          }
                          else -> false
                      }
                  }
              }

              private fun circle(color: Int, stroke: Int): GradientDrawable =
                  GradientDrawable().apply {
                      shape = GradientDrawable.OVAL
                      setColor(color)
                      setStroke(dp(2), stroke)
                  }

              /** Menüyü küçük bir noktaya indirir (görünmez gibi). Noktaya dokununca açılır. */
              private fun minimize() {
                  main.post {
                      mini?.background = circle(0xE0141518.toInt(), if (running) cAccent else 0xFF777777.toInt())
                      fullBox?.visibility = View.GONE
                      mini?.visibility = View.VISIBLE
                      panel?.let { try { wm.updateViewLayout(it, lp) } catch (_: Exception) {} }
                  }
              }

              private fun expand() {
                  main.post {
                      modeChip?.text = modeLabel(prefs().getInt("mode", 0))
                      colorChip?.text = colorLabel(prefs().getInt("color", 0))
                      mini?.visibility = View.GONE
                      fullBox?.visibility = View.VISIBLE
                      panel?.let { try { wm.updateViewLayout(it, lp) } catch (_: Exception) {} }
                  }
              }

