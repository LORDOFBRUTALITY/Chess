          package com.wex1n.chessbot

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.Image
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.view.WindowManager

          /**
           * Hızlı ekran yakalama (MediaProjection). Saniyede ~30 kare alır, sadece tahta bölgesinden
           * küçük bir örnek ızgarası çıkarıp FrameHub'a koyar. Kör modda taşların anlık görünmesini yakalamak içindir.
           */
          class CaptureService : Service() {
              private var projection: MediaProjection? = null
              private var display: VirtualDisplay? = null
              private var imageReader: ImageReader? = null
              private var thread: HandlerThread? = null

              override fun onBind(intent: Intent?): IBinder? = null

              @Suppress("DEPRECATION")
              private fun readData(i: Intent): Intent? =
                  if (Build.VERSION.SDK_INT >= 33) i.getParcelableExtra("data", Intent::class.java)
                  else i.getParcelableExtra<Intent>("data")

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent == null || intent.action == "stop") {
                      shutdown()
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  val code = intent.getIntExtra("code", 0)
                  val data = readData(intent)
                  if (data == null) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  startFg()
                  try {
                      begin(code, data)
                  } catch (e: Exception) {
                      shutdown()
                      stopSelf()
                  }
                  return START_NOT_STICKY
              }

              private fun startFg() {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel("capture", "Ekran yakalama", NotificationManager.IMPORTANCE_LOW)
                  )
                  val n = Notification.Builder(this, "capture")
                      .setContentTitle("ChessBot hızlı yakalama açık")
                      .setContentText("Kör mod için tahta kareleri alınıyor")
                      .setSmallIcon(android.R.drawable.ic_menu_camera)
                      .build()
                  startForeground(42, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
              }

              private fun begin(code: Int, data: Intent) {
                  val mgr = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  val proj = mgr.getMediaProjection(code, data)
                  projection = proj
                  val th = HandlerThread("chessbot-capture")
                  th.start()
                  thread = th
                  val h = Handler(th.looper)
                  proj.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() { shutdown() }
                  }, h)

                  val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val b = wm.maximumWindowMetrics.bounds
                  val w = b.width()
                  val hh = b.height()
                  val dpi = resources.displayMetrics.densityDpi
                  val ir = ImageReader.newInstance(w, hh, PixelFormat.RGBA_8888, 2)
                  imageReader = ir
                  ir.setOnImageAvailableListener({ r ->
                      val img = try { r.acquireLatestImage() } catch (e: Exception) { null }
                      if (img != null) {
                          try { handleImage(img) } finally { img.close() }
                      }
                  }, h)
                  display = proj.createVirtualDisplay(
                      "chessbot", w, hh, dpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      ir.surface, null, h
                  )
                  FrameHub.active = true
              }

              private fun handleImage(img: Image) {
                  val rc = FrameHub.rect ?: return
                  val plane = img.planes[0]
                  val buf = plane.buffer
                  val rs = plane.rowStride
                  val ps = plane.pixelStride
                  val g = FrameHub.G
                  val grid = IntArray(g * g)
                  val maxX = img.width - 1
                  val maxY = img.height - 1
                  for (gy in 0 until g) {
                      val y = (rc[1] + (gy + 0.5f) * rc[2] / g).toInt().coerceIn(0, maxY)
                      for (gx in 0 until g) {
                          val x = (rc[0] + (gx + 0.5f) * rc[2] / g).toInt().coerceIn(0, maxX)
                          val off = y * rs + x * ps
                          val r = buf.get(off).toInt() and 255
                          val gg = buf.get(off + 1).toInt() and 255
                          val bb = buf.get(off + 2).toInt() and 255
                          grid[gy * g + gx] = (r shl 16) or (gg shl 8) or bb
                      }
                  }
                  FrameHub.push(FrameHub.GridFrame(System.currentTimeMillis(), grid))
              }

              private fun shutdown() {
                  FrameHub.active = false
                  val d = display
                  val ir = imageReader
                  val p = projection
                  val t = thread
                  display = null
                  imageReader = null
                  projection = null
                  thread = null
                  try { d?.release() } catch (_: Exception) {}
                  try { ir?.close() } catch (_: Exception) {}
                  try { p?.stop() } catch (_: Exception) {}
                  try { t?.quitSafely() } catch (_: Exception) {}
              }

              override fun onDestroy() {
                  shutdown()
                  super.onDestroy()
              }
          }
