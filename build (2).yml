name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Proje dosyalarını yaz
        run: |
          set -e
          cat > settings.gradle.kts <<'CHESSBOT_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "ChessBot"
          include(":app")
          CHESSBOT_EOF
          cat > build.gradle.kts <<'CHESSBOT_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          CHESSBOT_EOF
          cat > gradle.properties <<'CHESSBOT_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          CHESSBOT_EOF
          cat > .gitignore <<'CHESSBOT_EOF'
          build/
          .gradle/
          local.properties
          *.iml
          .idea/
          app/src/main/jniLibs/
          CHESSBOT_EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'CHESSBOT_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.wex1n.chessbot"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.wex1n.chessbot"
                  minSdk = 30
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  ndk { abiFilters += "arm64-v8a" }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }

              // Stockfish'i libstockfish.so olarak çalıştırabilmek için dosyaya çıkarılmalı
              packaging { jniLibs { useLegacyPackaging = true } }
          }

          dependencies {
              implementation("com.github.bhlangonijr:chesslib:1.+")
          }
          CHESSBOT_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'CHESSBOT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:extractNativeLibs="true"
                  android:label="ChessBot"
                  android:theme="@android:style/Theme.DeviceDefault.Light">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ChessBotService"
                      android:exported="true"
                      android:label="ChessBot"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          CHESSBOT_EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'CHESSBOT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:canTakeScreenshot="true"
              android:description="@string/service_desc"
              android:notificationTimeout="100" />
          CHESSBOT_EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'CHESSBOT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="service_desc">Ekranı okuyup satranç tahtasında hamle yapar (sadece kendi hesapların arasında kullan).</string>
          </resources>
          CHESSBOT_EOF
          mkdir -p app/src/main/java/com/wex1n/chessbot
          cat > app/src/main/java/com/wex1n/chessbot/BoardReader.kt <<'CHESSBOT_EOF'
          package com.wex1n.chessbot

          import android.graphics.Bitmap
          import kotlin.math.abs

          /**
           * Ekran görüntüsünden tahtayı okur.
           * Taş şablonları, oyunun BAŞLANGIÇ pozisyonundan kendiliğinden öğrenilir (tema/taş seti fark etmez).
           * Kare indeksi (sq): rank*8 + file  (a1=0, h1=7, a8=56)
           */
          class BoardReader {
              @Volatile var x0 = 0f
              @Volatile var y0 = 0f
              @Volatile var x1 = 0f
              @Volatile var y1 = 0f
              @Volatile var whiteBottom = true
              @Volatile var trained = false

              private val n = 24            // her kareden 24x24 örnek
              private val c0 = 4            // merkez bölge: 4..19
              private val c1 = 20
              private val cells = (c1 - c0) * (c1 - c0)
              private val dim = cells * 2
              private val templates = Array(13) { FloatArray(dim) }

              val hasBoard: Boolean get() = (x1 - x0) > 50f && (y1 - y0) > 50f
              private val sw: Float get() = (x1 - x0) / 8f
              private val sh: Float get() = (y1 - y0) / 8f

              class SqFeat(val vec: FloatArray, val frac: Float, val meanLum: Float)

              companion object {
                  fun pieceIdx(ch: Char): Int = when (ch) {
                      'P' -> 0; 'N' -> 1; 'B' -> 2; 'R' -> 3; 'Q' -> 4; 'K' -> 5
                      'p' -> 6; 'n' -> 7; 'b' -> 8; 'r' -> 9; 'q' -> 10; 'k' -> 11
                      else -> 12
                  }

                  fun startChar(rank: Int, file: Int): Char = when (rank) {
                      0 -> "RNBQKBNR"[file]
                      1 -> 'P'
                      6 -> 'p'
                      7 -> "rnbqkbnr"[file]
                      else -> '.'
                  }
              }

              fun chessIdx(r: Int, c: Int): Int {
                  val file = if (whiteBottom) c else 7 - c
                  val rank = if (whiteBottom) 7 - r else r
                  return rank * 8 + file
              }

              /** Karenin ekrandaki merkez koordinatı */
              fun center(sq: Int): Pair<Float, Float> {
                  val file = sq % 8
                  val rank = sq / 8
                  val c = if (whiteBottom) file else 7 - file
                  val r = if (whiteBottom) 7 - rank else rank
                  return Pair(x0 + (c + 0.5f) * sw, y0 + (r + 0.5f) * sh)
              }

              private fun feat(bmp: Bitmap, r: Int, c: Int): SqFeat {
                  val left = x0 + c * sw
                  val top = y0 + r * sh
                  val total = n * n
                  val rr = IntArray(total)
                  val gg = IntArray(total)
                  val bb = IntArray(total)
                  val maxX = bmp.width - 1
                  val maxY = bmp.height - 1
                  for (j in 0 until n) {
                      for (i in 0 until n) {
                          val fx = left + (0.05f + 0.9f * (i + 0.5f) / n) * sw
                          val fy = top + (0.05f + 0.9f * (j + 0.5f) / n) * sh
                          val p = bmp.getPixel(fx.toInt().coerceIn(0, maxX), fy.toInt().coerceIn(0, maxY))
                          val k = j * n + i
                          rr[k] = (p shr 16) and 255
                          gg[k] = (p shr 8) and 255
                          bb[k] = p and 255
                      }
                  }
                  // Zemin rengi = karedeki en sık renk
                  val hist = IntArray(4096)
                  val bins = IntArray(total)
                  for (k in 0 until total) {
                      val b = ((rr[k] shr 4) shl 8) or ((gg[k] shr 4) shl 4) or (bb[k] shr 4)
                      bins[k] = b
                      hist[b]++
                  }
                  var best = 0
                  for (b in 1 until 4096) if (hist[b] > hist[best]) best = b
                  var sr = 0; var sg = 0; var sb = 0; var cnt = 0
                  for (k in 0 until total) {
                      if (bins[k] == best) { sr += rr[k]; sg += gg[k]; sb += bb[k]; cnt++ }
                  }
                  val bgr = sr / cnt
                  val bgg = sg / cnt
                  val bgb = sb / cnt

                  val bgSim = BooleanArray(total)
                  for (k in 0 until total) {
                      bgSim[k] = abs(rr[k] - bgr) + abs(gg[k] - bgg) + abs(bb[k] - bgb) <= 40
                  }
                  // Kenardan zemini doldur (flood fill); ulaşılamayan = taş
                  val reach = BooleanArray(total)
                  val stack = IntArray(total)
                  var sp = 0
                  fun push(k: Int) {
                      if (bgSim[k] && !reach[k]) { reach[k] = true; stack[sp++] = k }
                  }
                  for (i in 0 until n) {
                      push(i); push((n - 1) * n + i); push(i * n); push(i * n + n - 1)
                  }
                  while (sp > 0) {
                      val k = stack[--sp]
                      val x = k % n
                      val y = k / n
                      if (x > 0) push(k - 1)
                      if (x < n - 1) push(k + 1)
                      if (y > 0) push(k - n)
                      if (y < n - 1) push(k + n)
                  }

                  val v = FloatArray(dim)
                  var mc = 0
                  var lumSum = 0f
                  var idx = 0
                  for (j in c0 until c1) {
                      for (i in c0 until c1) {
                          val k = j * n + i
                          if (!reach[k]) {
                              val lum = (rr[k] * 299 + gg[k] * 587 + bb[k] * 114) / 255000f
                              v[idx] = 1f
                              v[cells + idx] = lum
                              mc++
                              lumSum += lum
                          }
                          idx++
                      }
                  }
                  return SqFeat(v, mc.toFloat() / cells, if (mc > 0) lumSum / mc else 0f)
              }

              private fun allFeatures(bmp: Bitmap): Array<SqFeat> =
                  Array(64) { k -> feat(bmp, k / 8, k % 8) }

              /** Başlangıç pozisyonundan şablonları öğrenir. Hata varsa mesaj döner, başarıda null. */
              fun tryTrain(bmp: Bitmap): String? {
                  if (!hasBoard) return "Önce ⌖ ile tahtayı kalibre et"
                  val f = allFeatures(bmp)
                  var minOcc = 1f
                  var maxEmp = 0f
                  for (r in 0 until 8) for (c in 0 until 8) {
                      val fr = f[r * 8 + c].frac
                      if (r <= 1 || r >= 6) { if (fr < minOcc) minOcc = fr } else { if (fr > maxEmp) maxEmp = fr }
                  }
                  if (minOcc < 0.10f || maxEmp > 0.05f) {
                      return "Başlangıç pozisyonu görünmüyor. Yeni oyunun ilk anında ▶'e bas (düz renkli tahta teması gerekli)."
                  }
                  var top = 0f
                  var bot = 0f
                  for (c in 0 until 8) {
                      top += f[c].meanLum + f[8 + c].meanLum
                      bot += f[48 + c].meanLum + f[56 + c].meanLum
                  }
                  top /= 16f
                  bot /= 16f
                  if (abs(top - bot) < 0.08f) return "Beyaz/siyah taşlar ayırt edilemedi"
                  whiteBottom = bot > top

                  val sums = Array(13) { FloatArray(dim) }
                  val counts = IntArray(13)
                  for (r in 0 until 8) for (c in 0 until 8) {
                      val sq = chessIdx(r, c)
                      val t = pieceIdx(startChar(sq / 8, sq % 8))
                      val v = f[r * 8 + c].vec
                      val s = sums[t]
                      for (i in 0 until dim) s[i] += v[i]
                      counts[t]++
                  }
                  for (t in 0 until 13) {
                      if (counts[t] > 0) for (i in 0 until dim) templates[t][i] = sums[t][i] / counts[t]
                  }
                  trained = true
                  return null
              }

              /** Her kare için 13 şablona (6 beyaz, 6 siyah, boş) uzaklık. Dizi: [sq][piece] */
              fun distances(bmp: Bitmap): Array<DoubleArray> {
                  val f = allFeatures(bmp)
                  val out = Array(64) { DoubleArray(13) }
                  for (r in 0 until 8) for (c in 0 until 8) {
                      val sq = chessIdx(r, c)
                      val v = f[r * 8 + c].vec
                      for (t in 0 until 13) {
                          val tp = templates[t]
                          var s = 0.0
                          for (i in 0 until dim) {
                              val d = v[i] - tp[i]
                              s += d * d
                          }
                          out[sq][t] = s
                      }
                  }
                  return out
              }
          }
          CHESSBOT_EOF
          mkdir -p app/src/main/java/com/wex1n/chessbot
          cat > app/src/main/java/com/wex1n/chessbot/Engine.kt <<'CHESSBOT_EOF'
          package com.wex1n.chessbot

          import android.content.Context
          import java.io.BufferedReader
          import java.io.BufferedWriter
          import java.io.File
          import java.util.Locale

          /** Stockfish'i (libstockfish.so) ayrı süreç olarak çalıştırıp UCI ile konuşur. */
          class Engine(private val ctx: Context) {
              private var proc: Process? = null
              private var writer: BufferedWriter? = null
              private var reader: BufferedReader? = null

              class Result(val move: String, val eval: String)

              @Synchronized
              fun start(): String? {
                  if (proc?.isAlive == true) return null
                  val f = File(ctx.applicationInfo.nativeLibraryDir, "libstockfish.so")
                  if (!f.exists()) return "Stockfish bulunamadı (libstockfish.so)"
                  return try {
                      val p = ProcessBuilder(f.absolutePath).redirectErrorStream(true).start()
                      proc = p
                      writer = p.outputStream.bufferedWriter()
                      reader = p.inputStream.bufferedReader()
                      send("uci")
                      if (!waitFor("uciok")) return "Motor yanıt vermedi"
                      val threads = Runtime.getRuntime().availableProcessors().coerceIn(1, 4)
                      send("setoption name Threads value $threads")
                      send("setoption name Hash value 64")
                      send("isready")
                      if (!waitFor("readyok")) return "Motor hazır olmadı"
                      null
                  } catch (e: Exception) {
                      "Motor başlatılamadı: ${e.message}"
                  }
              }

              @Synchronized
              private fun send(s: String) {
                  writer?.apply { write(s); write("\n"); flush() }
              }

              private fun waitFor(token: String): Boolean {
                  while (true) {
                      val line = reader?.readLine() ?: return false
                      if (line.startsWith(token)) return true
                  }
              }

              fun newGame() {
                  send("ucinewgame")
                  send("isready")
                  waitFor("readyok")
              }

              fun best(fen: String, moveTimeMs: Int): Result? {
                  send("position fen $fen")
                  send("go movetime $moveTimeMs")
                  var eval = ""
                  while (true) {
                      val line = reader?.readLine() ?: return null
                      if (line.startsWith("info") && line.contains(" score ")) {
                          val t = line.split(" ")
                          val i = t.indexOf("score")
                          if (i >= 0 && i + 2 < t.size) {
                              val v = t[i + 2].toIntOrNull()
                              if (v != null) {
                                  eval = if (t[i + 1] == "cp") String.format(Locale.US, "%+.2f", v / 100.0) else "M$v"
                              }
                          }
                      }
                      if (line.startsWith("bestmove")) {
                          val mv = line.split(" ").getOrNull(1) ?: return null
                          if (mv == "(none)") return null
                          return Result(mv, eval)
                      }
                  }
              }

              fun stop() { send("stop") }

              fun quit() {
                  try { send("quit") } catch (_: Exception) {}
                  proc?.destroy()
                  proc = null
              }
          }
          CHESSBOT_EOF
          mkdir -p app/src/main/java/com/wex1n/chessbot
          cat > app/src/main/java/com/wex1n/chessbot/ChessBotService.kt <<'CHESSBOT_EOF'
          package com.wex1n.chessbot

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.view.ContextThemeWrapper
          import android.view.Display
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import com.github.bhlangonijr.chesslib.Board
          import com.github.bhlangonijr.chesslib.Piece
          import com.github.bhlangonijr.chesslib.Side
          import com.github.bhlangonijr.chesslib.move.Move
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min

          class ChessBotService : AccessibilityService() {

              private val main = Handler(Looper.getMainLooper())
              private lateinit var wm: WindowManager
              private lateinit var uiCtx: Context
              private lateinit var lp: WindowManager.LayoutParams
              private var panel: LinearLayout? = null
              private var statusTv: TextView? = null
              private var buttonsRow: LinearLayout? = null

              private val reader = BoardReader()
              private lateinit var engine: Engine

              @Volatile private var running = false

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  uiCtx = ContextThemeWrapper(this, android.R.style.Theme_DeviceDefault_Light)
                  engine = Engine(this)
                  loadCalib()
                  buildPanel()
              }

              override fun onDestroy() {
                  running = false
                  try { panel?.let { wm.removeView(it) } } catch (_: Exception) {}
                  if (::engine.isInitialized) engine.quit()
                  super.onDestroy()
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              // ---------------------------------------------------------------- Arayüz

              private fun setStatus(s: String) {
                  main.post { statusTv?.text = s }
              }

              private fun buildPanel() {
                  val root = LinearLayout(uiCtx).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(8), dp(4), dp(8), dp(6))
                      background = GradientDrawable().apply {
                          setColor(0xDD202020.toInt())
                          cornerRadius = dp(10).toFloat()
                      }
                  }
                  val handle = TextView(uiCtx).apply {
                      text = "≡ ChessBot (sürükle / daralt)"
                      setTextColor(Color.WHITE)
                      textSize = 12f
                  }
                  val row = LinearLayout(uiCtx).apply { orientation = LinearLayout.HORIZONTAL }
                  fun btn(label: String, onClick: () -> Unit) {
                      val b = Button(uiCtx).apply {
                          text = label
                          textSize = 16f
                          minWidth = 0
                          minimumWidth = 0
                          setPadding(dp(14), 0, dp(14), 0)
                          setOnClickListener { onClick() }
                      }
                      row.addView(b, LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, dp(42)))
                  }
                  btn("▶") { startGame() }
                  btn("■") { stopGame() }
                  btn("⌖") { calibrate() }

                  val status = TextView(uiCtx).apply {
                      text = "Hazır. Önce ⌖ ile kalibre et."
                      setTextColor(0xFF9EE493.toInt())
                      textSize = 12f
                  }
                  root.addView(handle)
                  root.addView(row)
                  root.addView(status)
                  statusTv = status
                  buttonsRow = row

                  lp = WindowManager.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = dp(8)
                      y = dp(40)
                  }

                  var sx = 0f; var sy = 0f; var ox = 0; var oy = 0; var moved = 0f
                  handle.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              sx = e.rawX; sy = e.rawY; ox = lp.x; oy = lp.y; moved = 0f
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              lp.x = ox + (e.rawX - sx).toInt()
                              lp.y = oy + (e.rawY - sy).toInt()
                              moved = max(moved, abs(e.rawX - sx) + abs(e.rawY - sy))
                              wm.updateViewLayout(root, lp)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (moved < dp(8)) {
                                  row.visibility = if (row.visibility == View.VISIBLE) View.GONE else View.VISIBLE
                              }
                              true
                          }
                          else -> false
                      }
                  }
                  panel = root
                  wm.addView(root, lp)
              }

              // ------------------------------------------------------------ Kalibrasyon

              private fun prefs() = getSharedPreferences("chessbot", Context.MODE_PRIVATE)

              private fun loadCalib() {
                  val p = prefs()
                  reader.x0 = p.getFloat("x0", 0f)
                  reader.y0 = p.getFloat("y0", 0f)
                  reader.x1 = p.getFloat("x1", 0f)
                  reader.y1 = p.getFloat("y1", 0f)
              }

              private fun saveCalib(ax: Float, ay: Float, bx: Float, by: Float) {
                  val w = abs(bx - ax)
                  val h = abs(by - ay)
                  val side = (w + h) / 2f            // tahta kare olduğu için ortalama al
                  val left = min(ax, bx)
                  val top = min(ay, by)
                  reader.x0 = left; reader.y0 = top
                  reader.x1 = left + side; reader.y1 = top + side
                  prefs().edit()
                      .putFloat("x0", reader.x0).putFloat("y0", reader.y0)
                      .putFloat("x1", reader.x1).putFloat("y1", reader.y1)
                      .apply()
              }

              private fun overlayParams(touchable: Boolean): WindowManager.LayoutParams {
                  var flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                  if (!touchable) flags = flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  return WindowManager.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      flags,
                      PixelFormat.TRANSLUCENT
                  )
              }

              private fun calibrate() {
                  if (running) stopGame()
                  val ov = FrameLayout(uiCtx)
                  ov.setBackgroundColor(0x44000000)
                  val tv = TextView(uiCtx).apply {
                      text = "Tahtanın SOL ÜST köşesine dokun"
                      setTextColor(Color.WHITE)
                      textSize = 20f
                      gravity = Gravity.CENTER
                      setBackgroundColor(0xCC000000.toInt())
                      setPadding(dp(12), dp(40), dp(12), dp(12))
                  }
                  ov.addView(
                      tv,
                      FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.TOP)
                  )
                  var step = 0
                  var ax = 0f
                  var ay = 0f
                  ov.setOnTouchListener { _, e ->
                      if (e.action == MotionEvent.ACTION_UP) {
                          if (step == 0) {
                              ax = e.rawX; ay = e.rawY; step = 1
                              tv.text = "Şimdi tahtanın SAĞ ALT köşesine dokun"
                          } else {
                              val bx = e.rawX
                              val by = e.rawY
                              main.post {
                                  try { wm.removeView(ov) } catch (_: Exception) {}
                                  saveCalib(ax, ay, bx, by)
                                  showGrid()
                              }
                          }
                      }
                      true
                  }
                  wm.addView(ov, overlayParams(true))
              }

              private inner class GridView(c: Context) : View(c) {
                  private val paint = Paint().apply {
                      color = Color.GREEN
                      strokeWidth = 3f
                      style = Paint.Style.STROKE
                  }

                  override fun onDraw(canvas: Canvas) {
                      val s = (reader.x1 - reader.x0) / 8f
                      for (i in 0..8) {
                          canvas.drawLine(reader.x0 + i * s, reader.y0, reader.x0 + i * s, reader.y1, paint)
                          canvas.drawLine(reader.x0, reader.y0 + i * s, reader.x1, reader.y0 + i * s, paint)
                      }
                  }
              }

              private fun showGrid() {
                  setStatus("Kalibre edildi. Yeşil ızgara kareleri tutuyorsa tamam, değilse ⌖ ile tekrarla.")
                  val g = GridView(uiCtx)
                  wm.addView(g, overlayParams(false))
                  main.postDelayed({ try { wm.removeView(g) } catch (_: Exception) {} }, 3500)
              }

              // ------------------------------------------------------------ Oyun döngüsü

              private fun startGame() {
                  if (running) return
                  if (!reader.hasBoard) {
                      setStatus("Önce ⌖ ile kalibre et")
                      return
                  }
                  running = true
                  Thread {
                      try {
                          runGame()
                      } catch (e: Exception) {
                          setStatus("Hata: ${e.message}")
                      } finally {
                          running = false
                      }
                  }.start()
              }

              private fun stopGame() {
                  running = false
                  if (::engine.isInitialized) engine.stop()
                  setStatus("Durduruldu")
              }

              private fun screenshot(): Bitmap? {
                  val latch = CountDownLatch(1)
                  var result: Bitmap? = null
                  takeScreenshot(
                      Display.DEFAULT_DISPLAY,
                      mainExecutor,
                      object : AccessibilityService.TakeScreenshotCallback {
                          override fun onSuccess(r: AccessibilityService.ScreenshotResult) {
                              try {
                                  val hb = r.hardwareBuffer
                                  val hw = Bitmap.wrapHardwareBuffer(hb, r.colorSpace)
                                  result = hw?.copy(Bitmap.Config.ARGB_8888, false)
                                  hb.close()
                              } catch (_: Exception) {
                              }
                              latch.countDown()
                          }

                          override fun onFailure(errorCode: Int) {
                              latch.countDown()
                          }
                      }
                  )
                  latch.await(3, TimeUnit.SECONDS)
                  return result
              }

              private fun tap(p: Pair<Float, Float>) {
                  val path = Path().apply { moveTo(p.first, p.second) }
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 60))
                      .build()
                  val latch = CountDownLatch(1)
                  dispatchGesture(g, object : AccessibilityService.GestureResultCallback() {
                      override fun onCompleted(gestureDescription: GestureDescription?) { latch.countDown() }
                      override fun onCancelled(gestureDescription: GestureDescription?) { latch.countDown() }
                  }, main)
                  latch.await(2, TimeUnit.SECONDS)
              }

              private fun sqIdx(name: String): Int = (name[1] - '1') * 8 + (name[0].uppercaseChar() - 'A')

              private fun uciOf(m: Move): String {
                  val promo = if (m.promotion != Piece.NONE) m.promotion.fenSymbol.lowercase() else ""
                  return m.from.name.lowercase() + m.to.name.lowercase() + promo
              }

              private fun findMove(board: Board, uci: String): Move? =
                  board.legalMoves().firstOrNull { uciOf(it) == uci }

              private fun playMove(m: Move) {
                  val from = sqIdx(m.from.name)
                  val to = sqIdx(m.to.name)
                  tap(reader.center(from))
                  Thread.sleep(350)
                  tap(reader.center(to))
                  if (m.promotion != Piece.NONE) {
                      // Terfi penceresi: vezir genelde hedef karede çıkar
                      Thread.sleep(700)
                      tap(reader.center(to))
                  }
              }

              private fun placement(fen: String): CharArray {
                  val out = CharArray(64) { '.' }
                  val ranks = fen.substringBefore(' ').split('/')
                  for ((i, rs) in ranks.withIndex()) {
                      val rank = 7 - i
                      var file = 0
                      for (ch in rs) {
                          if (ch.isDigit()) file += (ch - '0') else { out[rank * 8 + file] = ch; file++ }
                      }
                  }
                  return out
              }

              private fun placementAfter(board: Board, m: Move?): CharArray {
                  if (m == null) return placement(board.fen)
                  board.doMove(m)
                  val p = placement(board.fen)
                  board.undoMove()
                  return p
              }

              private fun score(d: Array<DoubleArray>, p: CharArray): Double {
                  var s = 0.0
                  for (sq in 0 until 64) s += d[sq][BoardReader.pieceIdx(p[sq])]
                  return s
              }

              private fun runGame() {
                  setStatus("Motor başlatılıyor…")
                  engine.start()?.let { setStatus(it); return }
                  val moveTime = prefs().getInt("movetime", 1500)

                  var bmp = screenshot()
                  if (bmp == null) { setStatus("Ekran görüntüsü alınamadı"); return }
                  reader.tryTrain(bmp)?.let { setStatus(it); return }

                  val board = Board()
                  val botSide = if (reader.whiteBottom) Side.WHITE else Side.BLACK
                  engine.newGame()
                  setStatus(if (reader.whiteBottom) "Beyazla başlıyorum" else "Siyahla başlıyorum, rakip bekleniyor")

                  var sent: Move? = null
                  var sentAt = 0L
                  var retries = 0
                  var lastBest = -2
                  var lastCount = 0

                  while (running) {
                      if (board.isMated) { setStatus("Oyun bitti: mat"); break }
                      if (board.isDraw) { setStatus("Oyun bitti: beraberlik"); break }

                      if (board.sideToMove == botSide && sent == null) {
                          setStatus("Düşünüyor…")
                          val res = engine.best(board.fen, moveTime)
                          if (!running) break
                          if (res == null) { setStatus("Motor hamle üretemedi"); break }
                          val mv = findMove(board, res.move)
                          if (mv == null) { setStatus("Motor hamlesi anlaşılamadı: ${res.move}"); break }
                          playMove(mv)
                          sent = mv
                          sentAt = System.currentTimeMillis()
                          retries = 0
                          lastBest = -2
                          lastCount = 0
                          setStatus("Oynadım: ${res.move}  (${res.eval})")
                          Thread.sleep(700)
                          continue
                      }

                      bmp = screenshot()
                      if (bmp == null) { Thread.sleep(500); continue }
                      val d = reader.distances(bmp)

                      val cands = ArrayList<Move?>()
                      cands.add(null)
                      val sm = sent
                      if (sm != null) cands.add(sm) else cands.addAll(board.legalMoves())

                      var bi = 0
                      var b = Double.MAX_VALUE
                      var second = Double.MAX_VALUE
                      for (i in cands.indices) {
                          val s = score(d, placementAfter(board, cands[i]))
                          if (s < b) { second = b; b = s; bi = i } else if (s < second) second = s
                      }
                      val confident = (second - b) > 20.0

                      if (confident && bi != 0) {
                          if (bi == lastBest) lastCount++ else { lastBest = bi; lastCount = 1 }
                          if (lastCount >= 2) {
                              val mv = cands[bi]!!
                              val isMine = (sent != null)
                              board.doMove(mv)
                              if (isMine) {
                                  sent = null
                              } else {
                                  setStatus("Rakip: ${uciOf(mv)}")
                              }
                              lastBest = -2
                              lastCount = 0
                          }
                      } else {
                          lastBest = -2
                          lastCount = 0
                          val s2 = sent
                          if (s2 != null && confident && System.currentTimeMillis() - sentAt > 4000) {
                              retries++
                              if (retries > 2) { setStatus("Hamle oynanamadı, durdum (tahtayı/kalibrasyonu kontrol et)"); break }
                              setStatus("Hamle tutmadı, tekrar deniyorum…")
                              playMove(s2)
                              sentAt = System.currentTimeMillis()
                          }
                      }
                      Thread.sleep(600)
                  }
                  if (!running) setStatus("Durduruldu")
              }
          }
          CHESSBOT_EOF
          mkdir -p app/src/main/java/com/wex1n/chessbot
          cat > app/src/main/java/com/wex1n/chessbot/MainActivity.kt <<'CHESSBOT_EOF'
          package com.wex1n.chessbot

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("chessbot", MODE_PRIVATE)
                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad, pad, pad)
                  }

                  val info = TextView(this).apply {
                      textSize = 15f
                      text = "ChessBot kurulum:\n\n" +
                          "1) Aşağıdan Erişilebilirlik ayarlarını aç, ChessBot'u aç.\n" +
                          "   (Android 13+: Uygulama bilgisi > ⋮ > 'Kısıtlı ayarlara izin ver' gerekebilir.)\n" +
                          "2) chess.com uygulamasını bot hesabıyla aç. Ekranda küçük ChessBot paneli çıkar.\n" +
                          "3) Panelden ⌖ ile tahtanın sol üst ve sağ alt köşesine dokun (yeşil ızgara kareleri tutmalı).\n" +
                          "4) Diğer cihazdan oyun başlat. Oyunun İLK ANINDA (taşlar başlangıç yerindeyken) ▶'e bas.\n\n" +
                          "Not: Tahta temasını düz renkli yap. Sadece kendi hesapların arasında kullan."
                  }
                  root.addView(info)

                  root.addView(Button(this).apply {
                      text = "Erişilebilirlik Ayarlarını Aç"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  })

                  val status = TextView(this).apply { textSize = 14f }
                  root.addView(Button(this).apply {
                      text = "Motoru (Stockfish) Test Et"
                      setOnClickListener {
                          status.text = "Test ediliyor…"
                          Thread {
                              val e = Engine(this@MainActivity)
                              val r = e.start()
                              e.quit()
                              runOnUiThread { status.text = r ?: "Stockfish çalışıyor ✓" }
                          }.start()
                      }
                  })
                  root.addView(status)

                  val label = TextView(this).apply { textSize = 14f }
                  fun ms(p: Int) = 500 + p * 500
                  val bar = SeekBar(this).apply {
                      max = 9
                      progress = (prefs.getInt("movetime", 1500) - 500) / 500
                      label.text = "Hamle başına düşünme süresi: ${ms(progress)} ms"
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(sb: SeekBar?, p: Int, fromUser: Boolean) {
                              prefs.edit().putInt("movetime", ms(p)).apply()
                              label.text = "Hamle başına düşünme süresi: ${ms(p)} ms"
                          }
                          override fun onStartTrackingTouch(sb: SeekBar?) {}
                          override fun onStopTrackingTouch(sb: SeekBar?) {}
                      })
                  }
                  root.addView(label)
                  root.addView(bar)

                  setContentView(ScrollView(this).apply { addView(root) })
              }
          }
          CHESSBOT_EOF

      - name: Stockfish'i Android (arm64) için derle
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          curl -L -o sf.tar.gz https://github.com/official-stockfish/Stockfish/archive/refs/tags/sf_17.tar.gz
          tar xzf sf.tar.gz
          cd Stockfish-sf_17/src
          make -j4 build ARCH=armv8 COMP=ndk
          llvm-strip stockfish || true
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp stockfish "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libstockfish.so"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: chessbot-apk
          path: app/build/outputs/apk/debug/app-debug.apk
